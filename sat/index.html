const DATA = {"days": [{"id": "D1", "date": "Mon Nov 9", "sessions": [{"id": "D1A", "track": "English", "title": "Joining two sentences + \"; however,\"", "video": "SAT English - Joining Two Sentences", "qs": [{"id": "q1-1", "type": "J", "q": "The quarterback threw for 300 yards ___ his team still lost.", "ch": ["yards his", "yards, his", "yards but, his", "yards, but his"], "a": 3, "why": "Both sides are full sentences, so you need a strong joiner. Comma plus but works.", "wrong": {"0": [2, "Two full sentences with nothing between them. That is a run-on."], "1": [2, "A comma alone can't join two full sentences."], "2": [2, "The comma goes before but, not after it."]}, "facts": null, "find": null}, {"id": "q1-2", "type": "J", "q": "Honeybees communicate through movement ___ a bee's \"waggle dance\" shows other bees where to find food.", "ch": ["movement, a", "movement; a", "movement a", "movement, and, a"], "a": 1, "why": "Full sentence on both sides. A semicolon is a period wearing a hat.", "wrong": {"0": [2, "Comma alone between two full sentences."], "2": [2, "Nothing between two full sentences: a run-on."], "3": [2, "The comma after \"and\" is extra."]}, "facts": null, "find": null}, {"id": "q1-3", "type": "J", "q": "Built in 1924 ___ Soldier Field is one of the oldest stadiums in the NFL.", "ch": ["1924,", "1924;", "1924.", "1924 and"], "a": 0, "why": "Cover test: \"Built in 1924\" can't stand alone. Only one side is full, so a comma is right.", "wrong": {"1": [2, "A semicolon needs a full sentence on BOTH sides. \"Built in 1924\" isn't full."], "2": [2, "A period would leave \"Built in 1924.\" as a broken sentence."], "3": [2, "\"And\" joins two equal parts. This opener just needs a comma."]}, "facts": null, "find": null}, {"id": "q1-4", "type": "H", "q": "The forecast called for rain ___ the game was played in sunshine.", "ch": ["rain, however, the", "rain however the", "rain; however, the", "rain; however the"], "a": 2, "why": "Two full sentences with however in between: semicolon, however, comma.", "wrong": {"0": [2, "Comma alone. However is a passenger, not a joiner."], "1": [2, "No punctuation at all: a run-on."], "3": [2, "Close, but however needs a comma after it."]}, "facts": null, "find": null}, {"id": "q1-5", "type": "H", "q": "The museum was crowded on Saturday ___ the tour group waited an hour to get in.", "ch": ["Saturday, therefore, the", "Saturday; therefore, the", "Saturday therefore the", "Saturday; therefore the"], "a": 1, "why": "Therefore works just like however: semicolon before, comma after.", "wrong": {"0": [2, "Therefore can't join sentences with only commas."], "2": [2, "No punctuation: a run-on."], "3": [2, "Missing the comma after therefore."]}, "facts": null, "find": null}, {"id": "d1a-6", "type": "J", "q": "Dinoflagellates, a group of marine algae, can glow in the ___ do so to scare off predators.", "ch": ["dark, they", "dark they", "dark; they", "dark, and, they"], "a": 2, "why": "Both sides are full sentences. A semicolon joins them.", "wrong": {"0": [2, "Comma alone between two full sentences: this exact one was on your practice test."], "1": [2, "Run-on."], "3": [2, "The comma after and is extra."]}, "facts": null, "find": null}]}, {"id": "D1B", "track": "Math", "title": "Word problems on paper + \"per\" = slope", "video": "SAT Math - Word Problems on Paper", "qs": [{"id": "q1-6", "type": "WP", "q": "A phone plan charges a one-time $40 activation fee plus $25 per month. Which expression gives the total cost for m months?", "ch": ["25 + 40m", "65m", "25m − 40", "40 + 25m"], "a": 3, "why": "One-time fee: 40. Each month: 25, so 25m. Total: 40 + 25m.", "wrong": {"0": [4, "The 25 and 40 got swapped. The per-month number goes next to m."], "1": [4, "This charges the $40 fee every month. It is only paid once."], "2": [4, "The fee adds to the cost. It doesn't subtract."]}, "facts": ["1. fee (once) = 40", "2. each month = 25", "3. months = m", "Build: 40 ✓ + 25m ✓✓"], "find": "total cost for m months"}, {"id": "q1-7", "type": "WP", "q": "Jamal's age is 4 more than twice Sam's age, s. Jamal is 18. Which equation is true?", "ch": ["2s + 4 = 18", "2(s + 4) = 18", "s + 4 = 18", "4s + 2 = 18"], "a": 0, "why": "Twice Sam's age is 2s. Four more is + 4. Jamal is 18.", "wrong": {"1": [4, "This adds 4 BEFORE doubling. The sentence doubles first, then adds 4."], "2": [4, "This drops \"twice.\""], "3": [4, "The 2 and the 4 got swapped."]}, "facts": ["1. twice Sam = 2s", "2. 4 more = + 4", "3. Jamal = 18", "Build: 2s ✓ + 4 ✓ = 18 ✓"], "find": "an equation"}, {"id": "q1-8", "type": "WP", "q": "A taxi charges $3.50 to start plus $2.25 per mile. A ride cost $21.50. How many miles was the ride?", "ch": ["6", "8", "9.6", "11"], "a": 1, "why": "3.50 + 2.25m = 21.50. Subtract 3.50: 2.25m = 18. Divide: m = 8.", "wrong": {"0": [5, "Check it: 3.50 + 2.25 × 6 = 17. That isn't 21.50. Plug your answer back in."], "2": [4, "This divides 21.50 by 2.25 and drops the $3.50 start fee."], "3": [4, "This adds the start fee instead of subtracting it."]}, "facts": ["1. start = 3.50", "2. each mile = 2.25", "3. total = 21.50", "Build: 3.50 ✓ + 2.25m ✓ = 21.50 ✓ → m = 8"], "find": "miles"}, {"id": "q1-10", "type": "WP", "q": "A farm has c cows. It has 3 times as many chickens as cows, and it has 12 goats. The farm has 92 animals in total. Which equation is true?", "ch": ["4c + 12 = 92", "3c + 12 = 92", "3c + c = 92 + 12", "3(c + 12) = 92"], "a": 0, "why": "Cows c, chickens 3c, goats 12. c + 3c + 12 = 92, so 4c + 12 = 92.", "wrong": {"1": [4, "The cows themselves fell out. This only counts chickens and goats."], "2": [4, "The goats are part of the total, so they are added on the left."], "3": [4, "This multiplies the goats by 3 too."]}, "facts": ["1. cows = c", "2. chickens = 3c", "3. goats = 12", "4. total = 92", "Build: c ✓ + 3c ✓ + 12 ✓ = 92 ✓"], "find": "an equation"}, {"id": "q2-6", "type": "SL", "q": "A plumber charges $60 to visit plus $45 per hour. Which equation gives the cost C for h hours of work?", "ch": ["C = 60h + 45", "C = 105h", "C = 45(h + 60)", "C = 45h + 60"], "a": 3, "why": "Per hour is 45, so 45h. The visit is once: + 60.", "wrong": {"0": [4, "The per number and the one-time number got swapped."], "1": [4, "This charges the visit fee every hour."], "2": [4, "This multiplies the fee by 45 too."]}, "facts": ["1. visit (once) = 60", "2. per hour = 45 → 45h", "Build: 45h ✓ + 60 ✓"], "find": "equation for cost"}, {"id": "q2-7", "type": "SL", "q": "A kayak rental costs $40 for the first hour and $15 for each additional hour. What is the cost for 4 hours?", "ch": ["$55", "$60", "$85", "$100"], "a": 2, "why": "Extra hours: 4 − 1 = 3. 40 + 15 × 3 = 85.", "wrong": {"0": [5, "This only adds one extra hour."], "1": [4, "15 × 4 drops the first-hour price."], "3": [4, "40 + 15 × 4 forgets \"additional.\""]}, "facts": ["1. first hour = 40", "2. each EXTRA hour = 15", "3. extra hours = 4 − 1 = 3", "Build: 40 ✓ + 15 × 3 ✓✓ = 85"], "find": "cost for 4 hours"}, {"id": "q2-9", "type": "SL", "q": "A pool holds 600 gallons of water. It drains at 25 gallons per minute. Which equation gives the gallons G left after t minutes?", "ch": ["G = 600 + 25t", "G = 25t − 600", "G = 625t", "G = 600 − 25t"], "a": 3, "why": "Start: 600. Drains 25 per minute: minus 25t.", "wrong": {"0": [4, "Draining makes it go down, so it is minus."], "1": [4, "Start and slope got swapped."], "2": [4, "This combines the start and the rate."]}, "facts": ["1. start = 600", "2. per minute = −25 → −25t", "Build: 600 ✓ − 25t ✓"], "find": "gallons left"}, {"id": "d1b-8", "type": "SL", "q": "A fitness club charges $110 for the first month and $85 for each additional month. Which function gives the total R(m) for m months?", "ch": ["R(m) = 110m + 85", "R(m) = 110 + 85m", "R(m) = 110 + 85(m − 1)", "R(m) = 195m"], "a": 2, "why": "First month 110. Extra months: m − 1, each 85. This is the exact question you missed on Nov. 4.", "wrong": {"0": [4, "The first-month price and the per-month price got swapped."], "1": [4, "Forgot \"additional\": this charges the first month twice."], "3": [4, "This adds both prices every month."]}, "facts": ["1. first month = 110", "2. each EXTRA month = 85", "3. extra months = m − 1", "Build: 110 ✓ + 85(m − 1) ✓✓"], "find": "total for m months"}]}, {"id": "D1C", "track": "Geometry", "title": "Angles + right triangles", "video": "SAT Geometry - Angles and Right Triangles", "qs": [{"id": "d1c-1", "type": "AN", "q": "Two angles of a triangle measure 47° and 68°. What is the measure of the third angle?", "ch": ["65°", "115°", "75°", "133°"], "a": 0, "why": "180 − 47 − 68 = 65.", "wrong": {"1": [1, "115 is 47 + 68. They asked for the third angle."], "2": [5, "Recheck the subtraction: 180 − 115 = 65."], "3": [3, "That is 180 − 47 only. Subtract both angles."]}, "facts": null, "find": null}, {"id": "d1c-2", "type": "AN", "q": "Two angles form a straight line. One measures 3x° and the other measures (2x + 30)°. What is the value of x?", "ch": ["36", "30", "42", "90"], "a": 1, "why": "Straight line: 3x + 2x + 30 = 180 → 5x = 150 → x = 30.", "wrong": {"0": [4, "180 ÷ 5 drops the + 30."], "2": [3, "Subtract 30, don't add it: 5x = 150."], "3": [1, "90 is 3x. They asked for x."]}, "facts": null, "find": "x"}, {"id": "d1c-3", "type": "AN", "q": "Two lines cross. One of the four angles measures 70°. What is the angle directly across from it?", "ch": ["110°", "20°", "70°", "290°"], "a": 2, "why": "Angles directly across from each other are equal.", "wrong": {"0": [3, "110 is the angle NEXT to it (they make a straight line)."], "1": [3, "That would make a square corner, not a straight line."], "3": [3, "Angles here are under 180."]}, "facts": null, "find": null}, {"id": "d1c-4", "type": "PY", "q": "A right triangle has legs of length 9 and 12. What is the length of the hypotenuse?", "ch": ["15", "21", "225", "108"], "a": 0, "why": "81 + 144 = 225, and √225 = 15. (It's 3-4-5 times 3.)", "wrong": {"1": [3, "You can't just add the legs."], "2": [1, art before the colon isn't full."], "1": [2, "A semicolon needs full sentences on both sides."], "2": [2, "No comma between a verb and what comes after it."]}, "facts": null, "find": null}, {"id": "q2-3", "type": "P", "q": "The Statue of Liberty ___ a gift from France ___ was dedicated in 1886.", "ch": ["Liberty, a gift from France, was", "Liberty—a gift from France, was", "Liberty, a gift from France was", "Liberty a gift from France, was"], "a": 0, "why": "\"A gift from France\" is extra info. Two matching commas.", "wrong": {"1": [2, "Mismatched socks: a dash and a comma."], "2": [2, "Only one comma. Extra info needs a pair."], "3": [2, "Only one comma, and it splits the who from the did."]}, "facts": null, "find": null}, {"id": "q2-4", "type": "P", "q": "Marie Curie—the first person to win two Nobel Prizes ___ studied radioactivity.", "ch": ["Prizes, studied", "Prizes—studied", "Prizes studied", "Prizes; studied"], "a": 1, "why": "It started with a dash, so it must end with a dash.", "wrong": {"0": [2, "Mismatched socks: dash, then comma."], "2": [2, "The extra info is never closed."], "3": [2, "A semicolon can't close extra info."]}, "facts": null, "find": null}, {"id": "q3-1", "type": "W", "q": "The coaches on the sideline ___ the referee's call.", "ch": ["sideline, questioned", "sideline questioned", "sideline; questioned", "sideline—questioned"], "a": 1, "why": "\"The coaches\" is the who. \"Questioned\" is the did. No wall between them.", "wrong": {"0": [2, "A comma between the who and the did."], "2": [2, "A semicolon needs two full sentences."], "3": [2, "A dash between the who and the did."]}, "facts": null, "find": null}, {"id": "q3-2", "type": "W", "q": "Scientists in Brazil searched for ___ a rare species of frog.", "ch": ["for, a", "for: a", "for; a", "for a"], "a": 3, "why": "No punctuation right after \"for.\"", "wrong": {"0": [2, "Comma right after \"for.\""], "1": [2, "\"Scientists in Brazil searched for\" isn't a full sentence, so no colon."], " const L = ['A','B','C','D'];
const SESS = {}; DATA.days.forEach(d => d.sessions.forEach(s => { s.day = d; SESS[s.id.toLowerCase()] = s; }));
const store = {
  get(){ try { return JSON.parse(localStorage.getItem('satws') || '{}'); } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem('satws', JSON.stringify(v)); } catch(e){} }
};
let cur = null, st = null;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function qtext(s){ return esc(s).replace(/_{3,}/g,'<span class="blank">___</span>'); }

// type choices: the right type + 3 others from the same subject (stable per question)
function typeChoices(q, s){
  const pool = [];
  DATA.days.forEach(d => d.sessions.forEach(x => { if (x.track === s.track || (s.track==='Review')) x.qs.forEach(y => { if (!pool.includes(y.type)) pool.push(y.type); }); }));
  const others = pool.filter(t => t !== q.type);
  let h = 0; for (const c of q.id) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const pick = [];
  while (pick.length < Math.min(3, others.length)) { const t = others[h % others.length]; if (!pick.includes(t)) pick.push(t); h = (h*1103515245 + 12345) >>> 0; }
  const all = [...pick]; all.splice(h % (pick.length+1), 0, q.type);
  return all;
}

function start(id){
  cur = SESS[id] || SESS['d1a'];
  st = { i:0, phase:'type', typeTries:0, ansTried:[], results:[] };
  renderNav(); renderQ();
}

function renderNav(){
  const saved = store.get();
  document.getElementById('days').innerHTML = DATA.days.map((d,i) =>
    `<button class="tab" aria-pressed="${d===cur.day}" data-day="${i}">Day ${i+1}<small>${esc(d.date)}</small></button>`).join('');
  document.getElementById('sess').innerHTML = cur.day.sessions.map((s,i) => {
    const r = saved[s.id];
    return `<button class="tab sess trk-${s.track}" aria-pressed="${s===cur}" data-s="${s.id}">Session ${i+1} · ${esc(s.track)}${r?` <span class="done">✓ ${r.score}/${r.total}</span>`:''}<small>${esc(s.title)}</small></button>`;
  }).join('');
}

function dots(){
  return `<div class="dots" aria-label="Question ${st.i+1} of ${cur.qs.length}">` + cur.qs.map((q,i) => {
    const r = st.results[i]; return `<span class="dot ${r ? (r.first ? 'ok' : 'miss') : (i===st.i ? 'now' : '')}"></span>`;
  }).join('') + '</div>';
}

function head(){
  return `<div class="top"><h2>${esc(cur.title)}</h2><span class="lab" style="color:var(--muted)">Question ${Math.min(st.i+1,cur.qs.length)} of ${cur.qs.length}</span></div>
    ${cur.video ? `<div class="vid">Goes with the video: <b>${esc(cur.video)}</b></div>` : ''}${dots()}`;
}

  let h = head() + s3 + `<p class="q">${qtext(q.q)}</p>`;
  if (ph === 'type') {
    h += `<p class="ask">What type of question is this?</p><div class="opts">` + typeChoices(q, cur).map((t,i) =>
      `<button class="opt typeopt${st.typeX && st.typeX.includes(t)?' x':''}" data-type="${t}" ${st.typeX && st.typeX.includes(t)?'disabled':''}><span class="L">${i+1}</span><span class="T">${esc(DATA.types[t])}</span></button>`).join('') + '</div>';
    if (st.typeX && st.typeX.length) h += `<div class="box b-trap"><span class="lab">Not that one</span><p>Look at what changes in the answer choices, then pick again.</p></div>`;
  } else {
    h += `<div class="box b-def"><span class="lab">Type · ${esc(DATA.types[q.type])}</span><p><b>Rule:</b> ${esc(DATA.rules[q.type] || '')}</p></div>`;
    if (q.find && ph === 'ans') h += `<div class="box b-math"><span class="lab">On your paper first</span><p>Write <b>FIND:</b> at the top, then one fact per line.</p></div>`;
    h += `<p class="ask">${ph==='ans' ? 'Pick the answer.' : 'Answer'}</p><div class="opts">` + q.ch.map((c,i) => {
      const x = st.ansTried.includes(i) && i !== q.a, ok = ph==='done' && i===q.a;
      return `<button class="opt${x?' x':''}${ok?' right':''}" data-a="${i}" ${ph==='done'||x?'disabled':''}><span class="L">${L[i]}</span><span class="T">${esc(c)}</span></button>`;
    }).join('') + '</div>';
    const last = st.ansTried[st.ansTried.length-1];
    if (ph === 'ans' && last !== undefined && last !== q.a) {
      const w = q.wrong[String(last)] || [5,'Not quite.'];
      h += `<div class="box b-trap"><span class="lab">${L[last]} is a trap · ${esc(DATA.reasons[w[0]])}</span><p>${esc(w[1])} Try again.</p></div>`;
    }
    if (ph === 'done') {
      const r = st.results[st.i];
      h += `<div class="box b-ok"><span class="lab">${r.first ? 'Right on the first try' : 'Got it'} · ${L[q.a]}</span><p>${esc(q.why)}</p></div>`;
      if (q.facts) h += `<div class="box b-math"><span class="lab">Your paper should look like this</span><p class="paper">FIND: ${esc(q.find)}\n${q.facts.map(esc).join('\n')}</p></div>`;
      if (!r.first) h += `<div class="box b-rem"><span class="lab">Mistake List</span><p>Write: <b>${esc(DATA.types[q.type])}</b> · ${esc(DATA.reasons[r.reason])}</p></div>`;
      h += `<div class="actions"><button class="btn" id="next">${st.i+1 < cur.qs.length ? 'Next question' : 'See my results'}</button></div>`;
    }
  }
  m.innerHTML = h;
  const nb = document.getElementById('next'); if (nb) nb.focus();
}

function renderEnd(){
  const n = cur.qs.length, score = st.results.filter(r => r.first).length;
  const typed = st.results.filter(r => r.typeFirst).length;
  const saved = store.get(); saved[cur.id] = { score, total:n }; store.set(saved);
  const miss = st.results.map((r,i) => ({r, q:cur.qs[i]})).filter(x => !x.r.first);
  const idx = DATA.days.flatMap(d => d.sessions); const nxt = idx[idx.indexOf(cur)+1];
  let h = `<div class="top"><h2>${esc(cur.title)} · Done</h2></div>${dots()}
    <div class="row" style="gap:28px"><div><div class="score">${score}/${n}</div><div class="lab" style="color:var(--muted)">Right on first try</div></div>
    <div><div class="score">${typed}/${n}</div><div class="lab" style="color:var(--muted)">Named the type first try</div></div></div>`;
  if (miss.length) h += `<div class="box b-rem"><span class="lab">Copy onto your Mistake List</span><ul class="mist">` + miss.map(x =>
      `<li><b>${esc(DATA.types[x.q.type])}</b><span class="rn">${esc(DATA.reasons[x.r.reason])}</span></li>`).join('') + '</ul></div>';
  else h += `<div class="box b-ok"><span class="lab">Clean sheet</span><p>Every question right on the first try. Say each rule out loud once, then take a 10-minute break.</p></div>`;
  h += `<div class="actions">${miss.length ? '<button class="btn" id="redo">Redo the ones I missed</button>' : ''}<button class="btn ghost" id="again">Start over</button>${nxt ? `<button class="btn ghost" data-go="${nxt.id}">Next: ${esc(nxt.track)} · ${esc(nxt.day.date)}</button>` : ''}</div>`;
  document.getElementById('main').innerHTML = h; renderNav();
  st.missIdx = miss.map(x => cur.qs.indexOf(x.q));
}

function pickType(t){
  const q = cur.qs[st.i];
  if (t === q.type) { st.typeFirst = !(st.typeX && st.typeX.length); st.phase = 'ans'; st.typeX = []; }
  else { st.typeX = (st.typeX || []).concat(t); }
  renderQ();
}
function pickAns(i){
  const q = cur.qs[st.i];
  st.ansTried.push(i);
  if (i === q.a) {
    const first = st.ansTried.length === 1;
    const w = first ? null : (q.wrong[String(st.ansTried[0])] || [5]);
    st.results[st.i] = { first, typeFirst: st.typeFirst, reason: w ? w[0] : null };
    st.phase = 'done';
  }
  renderQ();
}
function next(){ st.i++; st.phase='type'; st.ansTried=[]; st.typeX=[]; renderQ(); window.scrollTo({top:0}); }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.day) { const d = DATA.days[+b.dataset.day]; location.hash = d.sessions[0].id.toLowerCase(); }
  else if (b.dataset.s) location.hash = b.dataset.s.toLowerCase();
  else if (b.dataset.go) location.hash = b.dataset.go.toLowerCase();
  else if (b.dataset.type) pickType(b.dataset.type);
  else if (b.dataset.a !== undefined) pickAns(+b.dataset.a);
  else if (b.id === 'next') next();
  else if (b.id === 'again') start(cur.id.toLowerCase());
  else if (b.id === 'redo') { const keep = st.missIdx.map(i => cur.qs[i]); const base = cur; cur = Object.assign({}, base, { qs: keep, title: base.title + ' · Redo' }); st = { i:0, phase:'type', ansTried:[], results:[] }; renderQ(); cur = Object.assign(cur,{}); }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase(); let n = '1234'.indexOf(k); if (n < 0) n = 'ABCD'.indexOf(k);
  if (e.key === 'Enter' && document.getElementById('next') && document.activeElement.id !== 'next') { next(); return; }
  if (n < 0) return;
  const btns = [...document.querySelectorAll('#main .opt')]; if (btns[n] && !btns[n].disabled) btns[n].click();
});
function route(){ const h = location.hash.slice(1).toLowerCase(); start(SESS[h] ? h : 'd1a'); }
window.addEventListener('hashchange', route);
route();
</script>
</body></html>
