<style>
/* Layout: one column like a playbook page. One step on screen at a time. Colors follow the course key. */
:root{
 --bg:#f2f4f8;--paper:#fff;--ink:#1d2740;--muted:#5b6475;--line:#d6dce7;
 --blue:#2f6fb5;--blue-bg:#e3eef9;--green:#2e7d4f;--green-bg:#e2f3e8;--red:#c0392b;--red-bg:#fbe3e0;
 --yellow:#a87908;--yellow-bg:#fdf3cf;--purple:#6a3fa0;--purple-bg:#eee6f7;
 --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161f;--paper:#1a2130;--ink:#e8ecf3;--muted:#9aa5b8;--line:#2e3a4f;
 --blue:#83b4ec;--blue-bg:#1c2c44;--green:#72d29b;--green-bg:#163225;--red:#f28b7f;--red-bg:#3a1f1d;--yellow:#f1c75d;--yellow-bg:#342b12;--purple:#bc9de8;--purple-bg:#29203f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161f;--paper:#1a2130;--ink:#e8ecf3;--muted:#9aa5b8;--line:#2e3a4f;
 --blue:#83b4ec;--blue-bg:#1c2c44;--green:#72d29b;--green-bg:#163225;--red:#f28b7f;--red-bg:#3a1f1d;--yellow:#f1c75d;--yellow-bg:#342b12;--purple:#bc9de8;--purple-bg:#29203f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:28px;line-height:1.15}
.sub{color:var(--muted);margin:2px 0 0}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0}
.lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
details.nav{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.nav summary{cursor:pointer;font-weight:700}
.grp{margin-top:10px}.grp .lab{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:14px;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer}
.chip b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--blue-bg);color:var(--blue);font-size:13px}
.chip.m b{background:var(--purple-bg);color:var(--purple)}
.chip.done{border-color:var(--green)}.chip.done b{background:var(--green);color:var(--paper)}
.chip.now{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:flex;gap:14px;align-items:center}
.big{flex:0 0 56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:30px;font-weight:700;background:var(--blue-bg);color:var(--blue)}
.big.m{background:var(--purple-bg);color:var(--purple)}
.top h2{margin:0;font-size:22px;line-height:1.2;text-wrap:balance}
.top .part{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 11px;cursor:pointer}
.steps button.on{border-color:var(--ink);color:var(--ink)}.steps button.fin{border-color:var(--green);color:var(--green)}
.box{border-left:5px solid;border-radius:0 10px 10px 0;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.box p{margin:0}
.b-def{background:var(--blue-bg);border-color:var(--blue)}.b-def .lab{color:var(--blue)}
.b-ok{background:var(--green-bg);border-color:var(--green)}.b-ok .lab{color:var(--green)}
.b-trap{background:var(--red-bg);border-color:var(--red)}.b-trap .lab{color:var(--red)}
.b-rem{background:var(--yellow-bg);border-color:var(--yellow)}.b-rem .lab{color:var(--yellow)}
.b-math{background:var(--purple-bg);border-color:var(--purple)}.b-math .lab{color:var(--purple)}
ol.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.ex{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ex .ok{color:var(--green)}.ex .no{color:var(--red)}.ex .why{color:var(--muted);font-size:15px}
.ex .ok::before{content:"✓ ";font-weight:700}.ex .no::before{content:"✗ ";font-weight:700}
.tq{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tq .where{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tq .his{color:var(--red)}.tq .his::before{content:"You picked ✗ ";font-weight:700}
.q{font-size:20px;line-height:1.45;margin:0}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:17px;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-weight:700;font-size:15px}
.opt .T{min-width:0;overflow-wrap:anywhere;padding-top:2px}
.opt.x{background:var(--red-bg);border-color:var(--red);color:var(--muted)}.opt.x .T{text-decoration:line-through;text-decoration-color:var(--red)}.opt.x .L{color:var(--red)}
.opt.right{background:var(--green-bg);border-color:var(--green);font-weight:700}.opt.right .L{color:var(--green)}
.opt:disabled{cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;font-size:16px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dots{display:flex;gap:5px}.dot{width:22px;height:8px;border-radius:4px;background:var(--line)}.dot.ok{background:var(--green)}.dot.miss{background:var(--red)}.dot.now{background:var(--ink)}
.score{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.muted{color:var(--muted)}
footer{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fade{animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media (max-width:480px){.q{font-size:18px}h1{font-size:24px}.top h2{font-size:19px}}
</style></head><body>
<div class="wrap">
 <header><h1>SAT Drill Zone</h1><p class="sub">SNAPS · CARE · CLUE · DRIVE. Learn it, see it, fix your test misses, drill it, say it.</p></header>
 <div><div class="actions" style="justify-content:space-between"><span class="lab muted" id="plab">0 of 20 mastered</span></div><div class="bar"><i id="pbar"></i></div></div>

 <main class="card fade" id="main" aria-live="polite"></main>

<script>
const C = [{"id": "s1", "part": "SNAPS · Grammar", "L": "S", "title": "Sentences: joining two full sentences", "learn": "A <b>full sentence</b> has a <b>who</b> + a <b>did</b> and can stand alone. Two full sentences need a <b>strong joiner</b>: a <b>period</b>, a <b>semicolon</b>, or a <b>comma + FANBOYS</b> (for, and, nor, but, or, yet, so).<br>A comma alone between two full sentences is a <b>comma splice</b> ✗. Nothing at all is a <b>run-on</b> ✗.", "hook": "A semicolon is a <b>period wearing a hat</b>. A comma alone is a <b>flag on the play</b>.", "how": ["Cover the right side of the blank. Is the left side a full sentence?", "Cover the left side. Is the right side a full sentence?", "Both full → <b>. or ; or , + FANBOYS</b>. Only one full → a comma (or nothing)."], "examples": [["The Ravens won the game<b>.</b> The fans stormed the field. · won the game<b>;</b> the fans… · won the game<b>, and</b> the fans…", "The Ravens won the game<b>,</b> the fans stormed the field.", "Both sides are full sentences, so a comma alone is a splice."], ["After the long practice<b>,</b> the team rested.", "After the long practice<b>;</b> the team rested.", "\"After the long practice\" can't stand alone, so the semicolon is wrong. A comma is right."], ["The kicker missed<b>, but</b> the team still won.", "The kicker missed<b>; but</b> the team still won.", "A semicolon already joins. Adding \"but\" doubles up."]], "test": [["R&W Module 1 · Q14", "Consultants predicted the Aeron Chair would prove ___ predictions were stunningly inaccurate.", "unpopular, such", "unpopular. Such", "Both sides are full sentences. A comma alone can't join them. \"unpopular: but\" and \"unpopular; but\" double up joiners."]], "drills": [{"q": "The storm knocked out power across the ___ crews worked all night to restore it.", "ch": [["city; crews", true, "Both sides are full sentences, and a semicolon joins them."], ["city, crews", false, "A comma alone between two full sentences is a splice."], ["city crews", false, "No joiner at all: a run-on."], ["city, so, crews", false, "The comma goes before \"so,\" not after it."]]}, {"q": "Although the bridge reopened on ___ traffic stayed heavy for weeks.", "ch": [["Monday.", false, "The left side isn't a full sentence, so it can't end with a period."], ["Monday,", true, "\"Although the bridge reopened on Monday\" can't stand alone, so a comma is right."], ["Monday;", false, "A semicolon needs a full sentence on both sides."], ["Monday, and", false, "\"And\" joins two full sentences, but the left side isn't full."]]}, {"q": "The quarterback threw for 300 ___ his team still lost by ten.", "ch": [["yards,", false, "A comma alone can't join two full sentences."], ["yards; but", false, "The semicolon already joins. \"But\" doubles up."], ["yards, but", true, "Two full sentences: comma + FANBOYS (\"but\")."], ["yards but,", false, "The comma goes before \"but,\" not after it."]]}], "say": "Say the rule for joining two full sentences, and the 3 right ways.", "key": "Full + full needs a period, a semicolon, or a comma + FANBOYS. A comma alone is wrong."}, {"id": "s2", "part": "SNAPS · Grammar", "L": "N", "title": "No wall: no punctuation between teammates", "learn": "<b>No punctuation</b> goes between words that belong together:<br>• the <b>who</b> and its <b>did</b> (The players who trained all summer | had the best season)<br>• the <b>did</b> and its <b>what</b> (signed | the contract)<br>• a <b>little word</b> (about, of, to, by, in) and the words after it (questions about | whether…)<br>• a <b>title right before a name</b> (astronomer Lucía Herrera)", "hook": "Teammates in the same huddle: <b>no wall between them</b>.", "how": ["Look at the words on each side of the blank.", "Do they belong together (who+did, did+what, about+its words, title+name)?", "If yes, <b>no punctuation</b>."], "examples": [["String theory faces questions about whether it can be tested.", "String theory faces questions<b>:</b> about whether it can be tested.", "\"About\" and its words belong together. No wall."], ["The players who trained all summer had the best season.", "The players who trained all summer<b>,</b> had the best season.", "The who (players) and the did (had) belong together."], ["The discovery was announced by astronomer Lucía Herrera.", "The discovery was announced by astronomer<b>,</b> Lucía Herrera.", "A title right before a name takes no comma. (You missed this one in October.)"]], "test": [["R&W Module 1 · Q15", "String theory remains beset by ___ whether its ideas can be tested.", "questions: about", "questions about", "A colon can't sit between \"questions\" and \"about.\" \"About\" and its words belong together."]], "drills": [{"q": "The bridge across the ___ in 1932.", "ch": [["river, opened", false, "A comma splits the who from its did."], ["river; opened", false, "\"Opened in 1932\" is not a full sentence."], ["river: opened", false, "A colon can't split the who from its did."], ["river opened", true, "The who (bridge) and the did (opened) belong together. No wall."]]}, {"q": "The results were published by ___ Ana Ruiz in a science journal.", "ch": [["biologist", true, "A title right before a name takes no punctuation."], ["biologist,", false, "No comma between a title and the name right after it."], ["biologist:", false, "A colon needs a full sentence before it."], ["biologist—", false, "A dash puts a wall between the title and the name."]]}, {"q": "The coach handed the new ___ the rookie after practice.", "ch": [["playbook, to", false, "The comma separates \"to\" from the action it finishes."], ["playbook to", true, "\"Playbook to the rookie\" belongs together. No wall."], ["playbook: to", false, "A colon must introduce a list or explanation. \"To the rookie\" is neither."], ["playbook; to", false, "\"To the rookie after practice\" is not a full sentence."]]}], "say": "Name the 4 places where you never put punctuation.", "key": "Between who and did, did and what, a little word and its words, and a title and the name after it."}, {"id": "s3", "part": "SNAPS · Grammar", "L": "A", "title": "Apostrophes and pronouns", "learn": "An apostrophe shows <b>ownership</b>. One owner: the <b>player's</b> helmet. More than one owner (ends in s): the <b>players'</b> helmets. More than one, owning nothing: the <b>players</b> ran.<br>Test: is the next word something <b>owned</b>? If yes, put the apostrophe on the owner.<br>Pronouns never use an apostrophe to own: <b>its, their, whose</b>. <b>it's</b> = it is. <b>they're</b> = they are.<br>Count the owners: <b>one → its</b>, <b>two or more → their</b>.", "hook": "Say it out loud: if \"it is\" or \"they are\" sounds wrong, the apostrophe is wrong.", "how": ["Find the word right after the blank. Is it owned?", "Count the owners: one or more than one?", "Pronoun? Read \"it is / they are\" in its place to test."], "examples": [["the team<b>'s</b> quarterback · both team<b>s'</b> coaches", "the teams coaches", "Coaches belong to the teams, so the owner needs an apostrophe."], ["Rice and tomatoes: the two plant<b>s'</b> genetic profiles overlap.", "the two plants genetic profile<b>s'</b>", "The plants own the profiles. The profiles don't own anything."], ["The Aztecs had two calendars, and <b>their</b> dates rarely lined up.", "two calendars, and <b>its</b> / <b>they're</b> dates", "Two calendars → their. \"They're dates\" means \"they are dates.\""]], "test": [["R&W Module 1 · Q16", "Rice and tomatoes: the two ___ share 68 gene families.", "plants genetic profiles'", "plants' genetic profiles", "The plants own the profiles. Apostrophe on the owner, not on what is owned."], ["R&W Module 1 · Q17", "Two paintings are similar in ___ use of large canvases.", "they're", "their", "Two paintings own the \"use,\" so their. They're = \"they are.\""], ["R&W Module 2 · Q17", "There were two calendars, and ___ dates rarely aligned.", "its", "their", "Two calendars → their. (19 seconds: you skipped the count.)"]], "drills": [{"q": "The museum changed ___ hours after the holiday crowds left.", "ch": [["it's", false, "It's = \"it is.\" \"It is hours\" makes no sense."], ["their", false, "One museum, so its, not their."], ["its", true, "One museum owns the hours → its (no apostrophe)."], ["its'", false, "\"Its'\" is never a word."]]}, {"q": "Both ___ owners voted to expand the playoffs.", "ch": [["team's", false, "\"Both\" means more than one team."], ["teams", false, "The owners belong to the teams, so it needs an apostrophe."], ["teams's", false, "Plural ending in s takes just the apostrophe."], ["teams'", true, "More than one team owns the owners: teams'."]]}, {"q": "The twins said ___ planning a trip to Lambeau Field.", "ch": [["they're", true, "\"They are planning\" fits."], ["their", false, "Their shows ownership. Nothing is owned here."], ["there", false, "There is a place."], ["their're", false, "Not a word."]]}], "say": "Explain player's, players', players, and its vs. it's.", "key": "One owner: player's. Many owners: players'. Just many: players. Its owns; it's = it is."}, {"id": "s4", "part": "SNAPS · Grammar", "L": "P", "title": "Pairs: matching marks around extra info", "learn": "Extra information you could <b>lift out</b> gets a <b>matching pair</b> of marks around it: <b>two commas</b>, <b>two dashes</b>, or <b>two parentheses</b>. Never mix them, and never use just one.<br><b>Lift-out test:</b> cover the words between the marks. Does the sentence still work? Then use the pair. If it breaks (like \"astronomer ___ announced\"), no marks.", "hook": "Like <b>socks</b>: always a matching pair.", "how": ["Find the extra info (a name, a description, a \"who/which\" part).", "Lift it out. Does the sentence still work?", "Yes → match the mark that opens it."], "examples": [["Radio signals from one distant planet<b>,</b> YZ Ceti b<b>,</b> hint at a link to Earth.", "from one distant planet<b>,</b> YZ Ceti b hint at…", "One sock. Lift out \"YZ Ceti b\" and the sentence still works, so it needs both commas."], ["Throat singing<b>—</b>a tradition with two performers<b>—</b>has found an advocate.", "Throat singing<b>—</b>a tradition with two performers<b>,</b> has found…", "Mixed socks. A dash opens it, so a dash closes it."], ["The stadium <b>(</b>built in 1998<b>)</b> seats 70,000 fans.", "The stadium (built in 1998<b>),</b> seats…", "No comma after the closing parenthesis: that puts a wall between who and did."]], "test": [["R&W Module 1 · Q19", "Radio signals from one distant ___ hint at a surprising link to Earth.", "planet, YZ Ceti b", "planet, YZ Ceti b,", "Lift out \"YZ Ceti b\" and the sentence works, so it needs a pair of commas. You used one sock (28 seconds)."]], "drills": [{"q": "Tom Brady—who won seven Super ___ retired in 2023.", "ch": [["Bowls,", false, "Mixed socks: a dash then a comma."], ["Bowls—", true, "A dash opened the extra info, so a dash closes it."], ["Bowls", false, "Only one sock. The extra info needs to be closed."], ["Bowls;", false, "A semicolon can't close extra info."]]}, {"q": "My favorite receiver, Justin ___ caught two touchdowns on Sunday.", "ch": [["Jefferson", false, "One sock: the opening comma needs a partner."], ["Jefferson—", false, "Mixed socks."], ["Jefferson,", true, "Lift out \"Justin Jefferson\" and it still works, so close it with a comma."], ["Jefferson;", false, "A semicolon can't close extra info."]]}, {"q": "Halley's Comet, which is visible from Earth about every 76 ___ will return in 2061.", "ch": [["years", false, "One sock."], ["years—", false, "Mixed socks."], ["years;", false, "\"Will return in 2061\" is not a full sentence."], ["years,", true, "The \"which…\" part is extra info opened by a comma, so a comma closes it."]]}], "say": "Explain the lift-out test and the sock rule.", "key": "Lift out the extra info. If the sentence still works, put matching marks on both sides: 2 commas, 2 dashes or 2 parentheses."}, {"id": "s5", "part": "SNAPS · Grammar", "L": "S", "title": "Subject X-ray and verb form", "learn": "<b>X-ray</b> the sentence: cross out anything between dashes or commas, and phrases starting with <b>of, with, in, from, who, that</b>. Find the real <b>who</b>.<br><b>One thing</b> → is / has / was / verb ending in <b>-s</b>. <b>Two or more</b> → are / have / were / no -s.<br><b>One main did per who:</b> if the sentence already has its main verb, a blank that describes a noun takes <b>-ing</b> (or -ed), not a second main verb.", "hook": "X-ray the play: <b>ignore the blockers, find the ball carrier</b>.", "how": ["Cross out the middle stuff.", "Find the who. One or many?", "Already have a main did? Then the blank is -ing, not a 2nd verb."], "examples": [["Throat singing<s>—a form of music that features two performers—</s> <b>has found</b> an advocate.", "Throat singing… <b>find</b> / <b>have found</b>", "X-ray: \"Throat singing has found.\" One thing → has."], ["The box <s>of footballs</s> <b>is</b> in the van.", "The box of footballs <b>are</b> in the van.", "The who is the box (one), not the footballs."], ["Lindqvist <b>detected</b> a profile closely <b>matching</b> nearby communities.", "Lindqvist detected a profile closely <b>matches</b>…", "\"Detected\" is the main did. The blank describes the profile, so -ing."]], "test": [["R&W Module 1 · Q18", "Inuit throat singing—a tradition with two performers—___ an advocate in Shina Novalinga.", "find", "has found", "X-ray out the dashes: \"throat singing has found.\" One thing → has. (26 seconds.)"], ["R&W Module 1 · Q20", "Lindqvist detected a genetic profile closely ___ the genomics of nearby communities.", "matches", "matching", "The sentence already has its main verb (detected). The blank describes the profile → -ing."]], "drills": [{"q": "The list of players picked for the Pro Bowl ___ posted every December.", "ch": [["is", true, "X-ray \"of players picked for the Pro Bowl.\" The list (one) is posted."], ["are", false, "Players isn't the who. The list is."], ["have been", false, "Plural verb. The list is one thing."], ["were", false, "Plural verb. The list is one thing."]]}, {"q": "The coaches, along with the team doctor, ___ the injury report each week.", "ch": [["reviews", false, "The doctor is in the crossed-out part. Coaches → review."], ["review", true, "X-ray \", along with the team doctor,\". The coaches (many) review."], ["has reviewed", false, "\"Has\" is for one thing."], ["is reviewing", false, "\"Is\" is for one thing."]]}, {"q": "Researchers found a fossil ___ features of both birds and dinosaurs.", "ch": [["shows", false, "A second main verb with no who."], ["has shown", false, "A second main verb with no who."], ["showing", true, "\"Found\" is the main did. The blank describes the fossil → -ing."], ["it shows", false, "This makes two full sentences with no joiner."]]}], "say": "Explain the X-ray and the one-main-verb rule.", "key": "Cross out the middle, find the who, match one or many. If the main verb is already there, the blank is -ing."}, {"id": "s6", "part": "CARE · Transitions", "L": "C", "title": "CARE: how do the two sentences connect?", "learn": "Cover the choices. Read the sentence <b>before</b> and <b>after</b> the blank. Decide the connection in one word, <b>before</b> you look:<br><b>C · Contrast</b> (turns, pushes back, replaces): however, still, nonetheless, instead, yet<br><b>A · Add</b> (same direction, or confirms it): moreover, in addition, similarly, indeed, in fact<br><b>R · Result</b> (caused by the first): therefore, thus, hence, as a result<br><b>E · Example</b> (shows the first in action): for example, for instance", "hook": "Do you <b>CARE</b> how they connect? Decide <b>before</b> you look.", "how": ["Cover the choices.", "Say C, A, R or E out loud.", "Pick from that group only. Cross out the others."], "examples": [["Bou <i>could</i> photograph rare birds. <b>Instead,</b> he tracks flocks of common birds. (C)", "Similarly,", "He chose something different over what he could do → Contrast (replace)."], ["Third spaces have sparked huge interest. <b>Nonetheless,</b> the idea isn't new: it dates to 1989. (C)", "Furthermore,", "\"Huge new interest\" vs. \"not new\" pushes back → Contrast."], ["Shōen mixed new subjects with old techniques. <b>Indeed,</b> her works show her era's contrasts. (A)", "In addition,", "\"Indeed\" confirms the same point. \"In addition\" would add a new, separate fact."], ["Sleeping brains show contradictory patterns. <b>For example,</b> sound-response cells turn on while others stay off. (E)", "In general,", "The 2nd sentence shows the pattern in action → Example."]], "test": [["R&W Module 1 · Q21", "Brain cells show contradictory patterns. ___ cells that respond to sound turn on while others stay dormant.", "In general,", "For example,", "The 2nd sentence is a specific case of the 1st → E."], ["R&W Module 2 · Q22", "Bou could capture images of rare birds. ___ he charts the flight paths of common birds.", "Similarly,", "Instead,", "He does something different → C (replace)."], ["R&W Module 2 · Q25", "\"Third spaces\" have stimulated enormous interest. ___ the concept is not new.", "Furthermore,", "Nonetheless,", "Pushes back → C."], ["R&W Module 2 · Q26", "Shōen mixed realism with tradition. ___ her works embody the era's contrasts.", "In addition,", "Indeed,", "The 2nd sentence confirms and sums up the 1st → Indeed."]], "drills": [{"q": "The Jets led by 14 at halftime. ___ they lost the game in overtime.", "ch": [["Therefore,", false, "Leading didn't cause the loss. Not a Result."], ["For example,", false, "Losing isn't an example of leading."], ["Similarly,", false, "They go in opposite directions."], ["Still,", true, "Leading, then losing → Contrast."]]}, {"q": "Honeybees can recognize human faces in lab tests. ___ some scientists now think insect memory is more complex than once believed.", "ch": [["As a result,", true, "The test finding caused the new view → Result."], ["However,", false, "No pushback: the 2nd follows from the 1st."], ["For instance,", false, "The 2nd sentence isn't a case of the 1st."], ["Instead,", false, "Nothing is being replaced."]]}, {"q": "Many rookie quarterbacks struggle at first. ___ Peyton Manning threw 28 interceptions in his first season.", "ch": [["Nonetheless,", false, "No contrast: it supports the 1st sentence."], ["For example,", true, "Manning is one case of a struggling rookie → Example."], ["Therefore,", false, "The 1st sentence didn't cause Manning's interceptions."], ["In addition,", false, "It doesn't add a new point. It shows the same one."]]}], "say": "Name the 4 CARE groups and 2 words in each.", "key": "Contrast: however, instead. Add: moreover, indeed. Result: therefore, hence. Example: for example, for instance."}, {"id": "r1", "part": "CLUE · Reading", "L": "W", "title": "Words in context", "learn": "Every reading question: <b>CLUE</b>. <b>C</b>over the choices · <b>L</b>ocate the clue words · <b>U</b>se your own words to predict · <b>E</b>liminate choices that are off-topic, too extreme, or never said.<br><br>For a blank: find the clue (often \"for instance,\" \"whereas,\" \"the opposite,\" or the sentence after). Put <b>your own simple word</b> in the blank first. Then pick the choice closest to your word. Never pick a word just because it sounds smart.", "hook": "Fill the blank with <b>your word first</b>, then shop for a match.", "how": ["Cover the choices.", "Find the clue and say your own word.", "Match. Cross out choices that mean something else."], "examples": [["Faulkner's novels <b>exhibited</b> world-building ambitions long before fantasy made it common.", "overcame", "Your word: \"showed.\" Exhibited = showed."], ["The play served a <b>twofold</b> purpose: it criticized one thing and also showed an alternative.", "external", "Clue: two jobs → twofold."], ["Foreign problems led to <b>unrest</b> in Russia. For instance, protests broke out.", "explanations", "Clue: protests → unrest."], ["Whereas some languages show <b>decoupling</b> of words for the same object, Pacific languages show the opposite: similarity.", "renderings", "The opposite of similarity is difference → decoupling."]], "test": [["R&W Module 1 · Q3", "Faulkner's novels ___ world-building ambitions generations before fantasy.", "overcame", "exhibited", "Your word: showed."], ["R&W Module 1 · Q4", "The play served a ___ purpose: critiquing X and signaling an alternative.", "external", "twofold", "It did two things."], ["R&W Module 2 · Q2", "Foreign problems led to ___ within Russia. For instance, protests broke out.", "explanations", "unrest", "Clue: protests."], ["R&W Module 2 · Q4", "Truths are acknowledged… or once-denied conditions are finally ___.", "personified", "divulged", "The list is about revealing things. Divulged = revealed."], ["R&W Module 2 · Q5", "Whereas some languages exhibit ___ of terms, Pacific languages show the opposite: similarity.", "renderings", "decoupling", "Opposite of similarity = separation. (34 seconds on a Hard one.)"]], "drills": [{"q": "The coach's speech was so ___ that several players asked for copies to reread before the game.", "ch": [["tedious", false, "Nobody rereads a boring speech."], ["inaudible", false, "Inaudible means hard to hear. Players wanted to reread it, so it was good."], ["stirring", true, "Your word: inspiring. Stirring = inspiring."], ["routine", false, "Ordinary doesn't explain asking for copies."]]}, {"q": "Unlike her outspoken teammates, the goalkeeper was ___, rarely speaking to reporters.", "ch": [["boastful", false, "That matches outspoken, not unlike it."], ["careless", false, "Off topic."], ["talkative", false, "The opposite of the clue."], ["reserved", true, "Clue: \"unlike outspoken\" and \"rarely speaking\" → quiet."]]}, {"q": "The new evidence ___ the old theory; researchers could no longer accept it.", "ch": [["undermined", true, "Clue: no longer accept → weakened."], ["confirmed", false, "The opposite."], ["inspired", false, "Off topic."], ["summarized", false, "Doesn't explain why they stopped accepting it."]]}], "say": "Say the CLUE steps for a vocabulary blank.", "key": "Cover choices, find the clue, say my own word, pick the closest match."}, {"id": "r2", "part": "CLUE · Reading", "L": "M", "title": "Main idea", "learn": "Every reading question: <b>CLUE</b>. <b>C</b>over the choices · <b>L</b>ocate the clue words · <b>U</b>se your own words to predict · <b>E</b>liminate choices that are off-topic, too extreme, or never said.<br><br>The main idea covers the <b>whole text</b>, not one detail. It's often in the turn (\"however,\" \"but\") or the last sentence. <b>Say the point in 5 words</b> before you look. Wrong answers: a detail that's too small, something too extreme, or something never said.", "hook": "Main idea = the <b>headline</b>, not one play from the game.", "how": ["Read the whole text.", "Say the point in 5 words.", "Cross out: too small, too extreme, never said."], "examples": [["Gummy bears: Riegel's changes helped them <b>evolve</b> into today's form.", "The earliest gummy bears would be unrecognizable today.", "Too extreme: the text says early ones were already gelatinous and fruit-flavored."], ["Jack London: the speaker's earlier adventures were <b>exciting and dangerous</b>.", "The narrator was afraid of taking risks.", "Never said: he calls it hazardous and thrilling."]], "test": [["R&W Module 1 · Q7", "Gummy bears: refined over time from Riegel's recipe; early ones larger and more detailed.", "Earliest would be unrecognizable", "Riegel's modifications helped gummy bears evolve", "Too extreme. The point is change over time."], ["R&W Module 2 · Q9", "A retired aeronaut: hazardous profession, many thrilling experiences.", "Afraid of taking risks", "Earlier adventures were exciting and dangerous", "Never said."]], "drills": [{"q": "Text: \"For decades, fans assumed the stadium's swirling winds were random. A 2024 study, however, mapped the stands and found that the curved roof funnels air into the same corner every game. Researchers say kickers could use the pattern to aim.\" Main idea?", "ch": [["Kickers have always struggled in this stadium.", false, "Never said."], ["A study found the stadium's winds follow a pattern caused by its roof.", true, "Covers the whole text: old belief, the study, and its finding."], ["Fans were wrong about everything at the stadium.", false, "Too extreme."], ["The stadium's roof was built in 2024.", false, "Wrong detail: the study was in 2024."]]}, {"q": "Text: \"Monarch butterflies travel up to 3,000 miles each fall. No single butterfly makes the round trip; it takes several generations. Scientists think the insects use the sun and Earth's magnetic field to find the same forests their great-grandparents left.\" Main idea?", "ch": [["Each monarch flies 3,000 miles twice in its life.", false, "The text says no single butterfly makes the round trip."], ["Scientists have fully proven how monarchs navigate.", false, "Too extreme: they \"think.\""], ["Monarch migration spans generations and relies on natural navigation cues.", true, "Covers both halves of the text."], ["Monarchs prefer forests to fields.", false, "A tiny detail, not the point."]]}], "say": "How do you find the main idea, and what are the 3 wrong-answer traps?", "key": "Say the point of the whole text in 5 words. Cross out too small, too extreme, never said."}, {"id": "r3", "part": "CLUE · Reading", "L": "I", "title": "Inferences: finish the thought", "learn": "Every reading question: <b>CLUE</b>. <b>C</b>over the choices · <b>L</b>ocate the clue words · <b>U</b>se your own words to predict · <b>E</b>liminate choices that are off-topic, too extreme, or never said.<br><br>Pick the ending the text <b>proves</b>, using only its facts. Find the setup word before the blank (thus, so, proves, because) and ask: what do the facts already say? Wrong answers add outside ideas, flip the facts, or go further than the text.", "hook": "Be a <b>referee</b>: only call what the replay shows.", "how": ["Underline the facts.", "Read the setup word (thus, proves).", "Pick the ending that follows directly. Nothing extra."], "examples": [["They turned light into light 7× higher in frequency, so this proves <b>low-frequency light can be transformed into much higher-frequency light</b>.", "high-frequency light improves the semiconductor", "Backwards: the semiconductor changed the light, not the other way."], ["Allende calls García Márquez's work \"immortal,\" so her similar elements are best seen as <b>homage</b> (a tribute) to him.", "allusions to multiple authors", "The text names only one author."]], "test": [["R&W Module 1 · Q12", "A semiconductor raised light's frequency 7×; their investigation proves that ___", "High-frequency light improves the semiconductor", "Low-frequency light can become much higher-frequency light", "Stick to what they showed."], ["R&W Module 1 · Q13", "Allende calls García Márquez's work \"immortal.\" Thus her \"derivative\" elements are ___", "Allusions to multiple authors", "Acts of homage to García Márquez", "Only one author is in the text."]], "drills": [{"q": "Text: \"Teams that practiced in heat for two weeks before the season had fewer cramps in September games than teams that did not. Heat training doesn't change a player's speed, but this finding suggests that ___\"", "ch": [["heat training makes players faster.", false, "The text says it doesn't change speed."], ["September games are always hot.", false, "Never said."], ["teams that don't train in heat lose more games.", false, "Goes too far: the text is about cramps, not wins."], ["heat training may help players' bodies handle hot games.", true, "Fewer cramps in hot games → bodies handle heat better."]]}, {"q": "Text: \"Ancient Pacific sailors left no written maps. However, islands far apart share the same crop plants, which can't cross the ocean on their own. Thus, researchers conclude that ___\"", "ch": [["people carried the plants between the islands.", true, "Plants can't travel alone, so people moved them."], ["the sailors drew maps that were later lost.", false, "Never said."], ["the plants spread between the islands on the wind.", false, "The text says they can't cross on their own."], ["every island was settled in the same year.", false, "Goes far beyond the facts."]]}], "say": "What makes an inference answer right?", "key": "It follows directly from the facts in the text. No outside ideas, no going further."}, {"id": "r4", "part": "CLUE · Reading", "L": "E", "title": "Evidence: support, weaken, illustrate", "learn": "Every reading question: <b>CLUE</b>. <b>C</b>over the choices · <b>L</b>ocate the clue words · <b>U</b>se your own words to predict · <b>E</b>liminate choices that are off-topic, too extreme, or never said.<br><br>First, say the <b>claim</b> in your own words (5 words). <b>Support or illustrate</b> = the choice that shows exactly that claim happening. <b>Weaken or challenge</b> = the choice that shows the <b>opposite</b> happening. Wrong answers are about the topic but not about the claim.", "hook": "Find the <b>exact play</b> being reviewed, then check the replay for it.", "how": ["Underline the claim. Say it in 5 words.", "Support → shows it. Weaken → shows the opposite.", "Cross out choices that only share the topic."], "examples": [["Claim: Nubia took on more Egyptian customs when it was <b>weak</b>. Challenge: a <b>powerful</b> Nubia still absorbing Egyptian customs.", "Assyrian conquests mixed in Assyrian customs.", "Doesn't touch the weak/strong part of the claim."], ["Claim: users work hard to <b>get the old default back</b>. Illustrate: \"every time, I switch back to the original color scheme.\"", "\"Color schemes don't matter to me.\"", "That's the opposite of the claim."]], "test": [["R&W Module 1 · Q11", "Claim: more \"Egyptianization\" when Nubia was weaker. Which finding challenges it?", "Assyrian conquests mixed customs", "A powerful Nubia pushing into Egypt while absorbing Egyptian customs", "Strong Nubia + more Egyptian customs = the opposite of the claim."], ["R&W Module 2 · Q13", "Claim: people make an effort to restore a default once it's replaced. Which quote illustrates it?", "\"Color schemes are unimportant to me\"", "\"I have to override random features and return to the original color scheme\"", "That user works to get the default back. (3 min 12 sec: slow, so mark it and move on next time.)"]], "drills": [{"q": "Claim: \"Players who sleep more than 8 hours make fewer mistakes.\" Which finding would most weaken it?", "ch": [["Players who slept 9 hours made the fewest mistakes.", false, "That supports the claim."], ["Players who slept 9+ hours made as many mistakes as players who slept 6.", true, "More sleep, same mistakes: the opposite of the claim."], ["Most players sleep about 7 hours.", false, "Doesn't test sleep against mistakes."], ["Coaches want players to sleep more.", false, "An opinion, not a finding about mistakes."]]}, {"q": "Claim: \"Fans cheer louder when the home team is losing.\" Which quote best illustrates it?", "ch": [["\"We cheer loudest after a touchdown.\"", false, "That's about scoring, not losing."], ["\"The stadium is quiet during timeouts.\"", false, "Off topic."], ["\"We were down 10 in the 4th, and the crowd got so loud the visitors had to use a silent count.\"", true, "Losing + louder crowd = the claim in action."], ["\"Our stadium is the loudest in the league.\"", false, "Doesn't mention losing."]]}], "say": "How do you answer a \"weaken the claim\" question?", "key": "Say the claim in 5 words, then pick the choice that shows the opposite happening."}, {"id": "r5", "part": "CLUE · Reading", "L": "P", "title": "Purpose, structure, and two texts", "learn": "Every reading question: <b>CLUE</b>. <b>C</b>over the choices · <b>L</b>ocate the clue words · <b>U</b>se your own words to predict · <b>E</b>liminate choices that are off-topic, too extreme, or never said.<br><br>Purpose and structure ask what the text <b>does</b>. Use a verb: introduces, contrasts, explains, argues, describes. Match the <b>whole</b> text, not one sentence.<br><b>Two texts:</b> say Text 1's point in 5 words, then how Text 2 relates: <b>agrees, disagrees, adds, or applies</b>.", "hook": "Purpose = the <b>play call</b>, not one player's route.", "how": ["Say what the text does with a verb.", "Check that it fits the whole text.", "Two texts: T1 point → T2 agrees / disagrees / adds."], "examples": [["Carlyle vs. Spencer: the first sentence <b>sets up two opposing views</b> that the rest explains.", "introduces two theories that both depend on a few great individuals", "Only Carlyle's theory does. Spencer's is the opposite."], ["Bastiani: the purpose is to <b>outline an issue that affects both painters</b> (no exact count of signed works).", "whether paintings were really by Bastiani", "The text is about counting, and it ends by saying Bellini has the same problem."], ["Text 1: T. phoenicis shuts down its metabolism to survive. Text 2: D. radiodurans does the same <b>and</b> resists radiation → <b>comparable strategy + more</b>.", "Text 2 says these places harm D. radiodurans", "Text 2 says it survives them."]], "test": [["R&W Module 2 · Q6", "Function of the first sentence (Carlyle vs. Spencer)?", "Two theories that both rely on great individuals", "Sets forward contrasting viewpoints explained later", "The two theories are opposites."], ["R&W Module 2 · Q7", "Main purpose of the Bastiani text?", "Uncertainty about who painted them", "Outline an issue relevant to both Bellini and Bastiani", "The last sentence brings in Bellini."], ["R&W Module 2 · Q8", "How do Text 1 (T. phoenicis) and Text 2 (D. radiodurans) relate?", "Same environments harm D. radiodurans", "Comparable strategy + radiation resistance", "Text 2 adds to Text 1. (3 min: flag long two-text questions and come back.)"]], "drills": [{"q": "Text: \"Most people think of deserts as lifeless. Yet the Sonoran Desert holds more than 2,000 plant species, and some, like the saguaro cactus, live over 150 years.\" Main purpose?", "ch": [["To explain how cacti store water", false, "Never discussed."], ["To argue that deserts should be protected", false, "No argument about protection."], ["To compare the Sonoran Desert with other deserts", false, "No other desert is named."], ["To challenge a common view by showing the desert's variety of life", true, "It sets up a belief, then pushes back with facts."]]}, {"q": "Text 1: \"Coach A says rookies learn fastest by playing in real games.\" Text 2: \"Coach B agrees game time matters, but says rookies first need a month of practice reps so they don't build bad habits.\" How does Text 2 relate to Text 1?", "ch": [["It accepts Text 1's point but adds a condition.", true, "Agrees (game time matters) + adds (practice first)."], ["It completely rejects Text 1.", false, "Coach B agrees game time matters."], ["It repeats Text 1 with no change.", false, "It adds the practice step."], ["It is about veterans, not rookies.", false, "Both texts are about rookies."]]}], "say": "How do you answer a purpose question, and a two-text question?", "key": "Purpose: a verb for what the whole text does. Two texts: T1 point, then agrees, disagrees or adds."}, {"id": "r6", "part": "CLUE · Reading", "L": "N", "title": "Notes questions: do exactly the goal", "learn": "Read the <b>question first</b> and underline the <b>goal</b> (\"explain the study and its outcomes,\" \"emphasize a similarity,\" \"specify how many\"). Then pick the choice that does <b>exactly</b> that goal, even if other choices are true facts from the notes.", "hook": "Run the <b>play that was called</b>. A different good play is still the wrong play.", "how": ["Read the question. Underline the goal words.", "Skip the notes at first.", "Pick the choice that does every part of the goal."], "examples": [["Goal: explain the gene-therapy study <b>and its outcomes</b> → \"Researchers arrived at a treatment that could restore the sense of smell in humans.\"", "\"A genetic precondition can impair smell; researchers turned to gene therapy.\"", "No outcome, so it misses half the goal."], ["Goal: specify how many faces an octahedron has → \"A regular octahedron has <b>eight</b> triangular faces.\"", "\"An octahedron has fewer faces than a dodecahedron.\"", "Doesn't give the number. (Your Nov 8 miss, picked in 4 seconds.)"]], "test": [["R&W Module 1 · Q26", "Goal: explain the gene therapy study and its outcomes.", "Genetic precondition… researchers gravitated to gene therapy", "Researchers arrived at a treatment that could restore smell in humans", "The goal says outcomes. Only one choice has an outcome."]], "drills": [{"q": "Notes: Lambeau Field opened in 1957. It is in Green Bay, Wisconsin. It seats about 81,000. It is the oldest continually operating NFL stadium. Goal: <b>emphasize the stadium's age</b>.", "ch": [["Lambeau Field in Green Bay seats about 81,000 fans.", false, "Size, not age."], ["Opened in 1957, Lambeau Field is the oldest continually operating stadium in the NFL.", true, "Both facts point to age."], ["Green Bay, Wisconsin, is home to Lambeau Field.", false, "Location, not age."], ["Lambeau Field is a large stadium in Wisconsin.", false, "Size and location, not age."]]}, {"q": "Notes: Venus and Earth are similar in size. Venus's surface is about 465°C. Earth's average is about 15°C. Goal: <b>contrast the two planets' temperatures</b>.", "ch": [["Venus and Earth are similar in size.", false, "A similarity, and not about temperature."], ["Venus's surface reaches about 465°C.", false, "Only one planet: no contrast."], ["Venus's surface reaches about 465°C, while Earth averages about 15°C.", true, "Gives both temperatures side by side."], ["Earth's average temperature is about 15°C.", false, "Only one planet: no contrast."]]}], "say": "What is the first thing you do on a notes question?", "key": "Underline the goal, then pick the choice that does exactly that goal."}, {"id": "m1", "part": "DRIVE · Math", "L": "D", "title": "Define FIND", "learn": "Before solving, write <b>FIND:</b> with the exact thing the question asks for, and circle it. The SAT often asks for something one step away from x: <b>x − 5, 2x, the diameter, the number that passed, c instead of b</b>. Stop when you reach the FIND.", "hook": "Know the <b>end zone</b> before you run the play.", "how": ["Read the last line. Write FIND: ___.", "Solve.", "Before clicking: does my answer match the FIND?"], "examples": [["√(x − 5) = 8. FIND: <b>x − 5</b>. Square both sides: x − 5 = <b>64</b>. Stop.", "59", "Don't solve for x. They want x − 5."], ["0.1197 is 0.09% of b, and b is 50% of c. FIND: <b>c</b>. 0.1197 ÷ 0.0009 = 133 = b. Then b = 0.5c → c = <b>266</b>.", "0.011", "Divide by the percent (as a decimal), and finish the chain to c."], ["Area = 64π → r = 8. FIND: <b>diameter</b> = 16.", "8", "8 is the radius."]], "test": [["Math Module 2 · Q5", "√(x − 5) = 8. What is x − 5?", "59", "64", "Square both sides and stop: x − 5 = 64."], ["Math Module 1 · Q19", "0.1197 is 0.09% of b; b is 50% of c. What is c?", "0.011", "266", "b = 0.1197 ÷ 0.0009 = 133, then c = 133 ÷ 0.5 = 266."]], "drills": [{"q": "If 3x + 4 = 19, what is the value of 6x?", "ch": [["5", false, "That's x. FIND is 6x."], ["15", false, "That's 3x."], ["38", false, "6x isn't 2 × 19."], ["30", true, "3x = 15, so 6x = 30."]]}, {"q": "A circle's circumference is 18π. What is its radius?", "ch": [["9", true, "C = 2πr → 18π = 2πr → r = 9."], ["18", false, "That's the diameter."], ["81", false, "That would be from an area."], ["36", false, "Doubled the wrong way."]]}, {"q": "24 is 40% of n, and n is 60% of p. What is p?", "ch": [["60", false, "That's n. Finish the chain to p."], ["100", true, "n = 24 ÷ 0.40 = 60. p = 60 ÷ 0.60 = 100."], ["36", false, "That's 60% of 60. Divide, don't multiply."], ["9.6", false, "That's 40% of 24."]]}], "say": "What do you write before solving, and why?", "key": "FIND: the exact thing they ask for, so I stop at the right answer.", "math": true}, {"id": "m2", "part": "DRIVE · Math", "L": "R", "title": "Read the trap words", "learn": "Underline trap words and slow down:<br>• <b>percent increase</b> = (new − old) ÷ old (not the total)<br>• <b>square units</b>: 1 ft² = 144 in² (12 × 12). Cubic: 1,728<br>• <b>\"10 more than the width\"</b>: length = width + 10, so width = length − 10<br>• <b>additional</b>: every one after the first (n − 1)<br>• <b>larger random sample</b> → <b>smaller</b> margin of error", "hook": "Trap words are the <b>blitz</b>. Spot them before the snap.", "how": ["Underline every trap word.", "Write what it means on paper.", "Then solve."], "examples": [["t → 3.47t. Increase = 2.47t → <b>247%</b>.", "347%", "347% is the new total compared with the old."], ["3,168 in² ÷ 144 = <b>22 ft²</b>.", "264", "Dividing by 12 only works for length, not area."], ["Length x is 10 more than the width → width = x − 10. V = <b>25x(x − 10)</b>.", "x(x + 25)(x − 10)", "The height 25 is a number, not x + 25."], ["Bigger random sample → <b>smaller</b> margin of error.", "larger", "More data = a more precise estimate."]], "test": [["Math Module 2 · Q13", "Pool use went from t hours to 3.47t hours. Percent increase?", "347%", "247%", "(3.47t − t) ÷ t = 2.47 = 247%."], ["Math Module 2 · Q12", "3,168 in². How many ft²?", "264", "22", "÷ 144 for square units. (19 seconds.)"], ["Math Module 1 · Q20", "Height 25; length x is 10 more than the width. Volume in terms of x?", "x(x + 25)(x − 10)", "25x(x − 10)", "V = length × width × height = x · (x − 10) · 25."], ["Math Module 1 · Q14", "Survey 240 students instead of 120. What happens?", "Margin of error larger", "Margin of error smaller", "Bigger random sample → smaller margin of error."]], "drills": [{"q": "A ticket price rose from $40 to $50. What is the percent increase?", "ch": [["20%", false, "Divided by the new price. Divide by the old."], ["10%", false, "That's the dollar change, not the percent."], ["25%", true, "(50 − 40) ÷ 40 = 0.25."], ["125%", false, "That's the new price compared with the old."]]}, {"q": "A rug has an area of 2,592 square inches. What is its area in square feet?", "ch": [["216", false, "Divided by 12. Square units need 144."], ["54", false, "Not ÷ 144."], ["1.5", false, "Divided by 1,728 (cubic)."], ["18", true, "2,592 ÷ 144 = 18."]]}, {"q": "A random survey of 500 fans has a margin of error of 4%. If a random survey of 2,000 fans is used instead, the margin of error will most likely be:", "ch": [["smaller", true, "Bigger random sample → smaller margin of error."], ["larger", false, "Backwards."], ["the same", false, "Sample size changes it."], ["exactly 1%", false, "You can't know the exact number."]]}], "say": "Name 3 trap words and what each one means.", "key": "Percent increase = change ÷ old. Square units ÷ 144. Bigger sample = smaller margin of error.", "math": true}, {"id": "m3", "part": "DRIVE · Math", "L": "I", "title": "Input: put it in Desmos", "learn": "Don't solve in your head. <b>Type it into Desmos</b>.<br>• One-variable equation: type it as is (use x). Desmos shows the answer.<br>• Min or max: graph it and <b>click the vertex</b>.<br>• Zeros: click where the graph crosses the x-axis.<br>• Vertex x is <b>halfway between the two zeros</b>.<br>• a + b + c = the y-value at <b>x = 1</b>.", "hook": "Desmos is your <b>best receiver</b>. Throw to it.", "how": ["Type the equation exactly.", "Click the point you need (vertex, crossing).", "Read the x or y the question asks for."], "examples": [["f(x) = 2x² − 17x + 33 → click the low point → x = <b>4.25</b>.", "5", "Guessed a whole number. Desmos shows 4.25."], ["0.10(9) + 0.20x = 0.17(9 + x) → x = <b>21</b>.", "22", "Done in your head in 15 seconds."], ["h(16) = 0, h(28) = 0 → vertex x = (16 + 28) ÷ 2 = <b>22</b>.", "16", "16 is a zero, not the vertex."], ["Vertex (6, −20), opens up (crosses the x-axis twice). a + b + c = y at x = 1, which must be above −20 → <b>−15</b>.", "−20", "−20 is the y-value at x = 6, the lowest point. At x = 1 it must be higher."]], "test": [["Math Module 2 · Q9", "f(x) = 2x² − 17x + 33. For what x is f minimum?", "5", "4.25", "Click the vertex in Desmos."], ["Math Module 2 · Q11", "0.10x + 0.20y = 0.17(x + y), x = 9. Find y.", "22", "21", "Type it in Desmos."], ["Math Module 1 · Q17", "h(16) = 0 and h(28) = 0; vertex (k, −36). k?", "16", "22", "Halfway between the zeros."], ["Math Module 1 · Q22", "Vertex (6, −20), crosses the x-axis twice. a + b + c could be?", "−20", "−15", "a + b + c is f(1), which is above the minimum of −20."]], "drills": [{"q": "f(x) = x² − 10x + 21. For what value of x does f(x) reach its minimum?", "ch": [["3", false, "That's a zero."], ["5", true, "Vertex x = 10 ÷ 2 = 5 (or click it in Desmos)."], ["7", false, "That's a zero."], ["−4", false, "That's the minimum value, not the x."]]}, {"q": "0.3(x + 20) = 0.5x. What is x?", "ch": [["12", false, "Check: 0.3(32) ≠ 0.5(12)."], ["20", false, "Check: 0.3(40) = 12, but 0.5(20) = 10."], ["30", true, "0.3x + 6 = 0.5x → 6 = 0.2x → x = 30."], ["60", false, "Check: 0.3(80) = 24, but 0.5(60) = 30."]]}, {"q": "A quadratic g has g(−2) = 0 and g(8) = 0. Its vertex is (k, 25). What is k?", "ch": [["−2", false, "That's a zero."], ["8", false, "That's a zero."], ["25", false, "That's the y of the vertex."], ["3", true, "Halfway between −2 and 8: (−2 + 8) ÷ 2 = 3."]]}], "say": "What 3 things can Desmos find for you?", "key": "The answer to an equation, the vertex (min or max), and where a graph crosses the x-axis.", "math": true}, {"id": "m4", "part": "DRIVE · Math", "L": "V", "title": "Verify and check edge numbers", "learn": "Before you click, <b>plug your answer back in</b>.<br><b>Edge numbers:</b> with &lt;, &gt; or \"no solutions,\" the edge number itself usually doesn't work. Test it. If it fails, step one past it.<br><b>No-solution systems:</b> same slope, different line. If your choice simplifies to the <b>same</b> line, that's infinitely many, not none.<br><b>Two choices with the same slope?</b> Plug the given point into each.", "hook": "Check the <b>replay</b> before you celebrate.", "how": ["Plug the answer into the original.", "At an edge number, ask: \"Does this number itself work?\"", "Systems: simplify both equations and compare."], "examples": [["No solutions when k &lt; −30. At −30 there is one solution, so the greatest integer is <b>−31</b>.", "−30", "The edge itself doesn't work."], ["38(x − d) = 38y + 38d → x − y = 2d. 4x − 4y = 4d → x − y = d: parallel → <b>no solution</b>.", "4x − 4y = 8d", "That simplifies to x − y = 2d: the same line (infinitely many)."], ["Line through (2, 5) with slope ½: y = ½x + 4. Check: ½(2) + 4 = <b>5</b> ✓.", "y = ½x + 13/3", "Check: 1 + 13/3 ≠ 5."]], "test": [["Math Module 2 · Q19", "38(x − d) = 38y + 38d has no solution with which second equation?", "4x − 4y = 8d", "4x − 4y = 4d", "Yours was the same line. Divide both by their number and compare."], ["Nov 12 question bank", "1/k + x/120 = 1/(kx) has no solutions. Greatest integer k?", "−30", "−31", "At −30 there is a solution, so step one past it."], ["Nov 9 question bank", "r is a positive integer and r < 15. Greatest r?", "15", "14", "\"Less than 15\" doesn't include 15."]], "drills": [{"q": "2x − 3 < 11. What is the greatest integer value of x?", "ch": [["6", true, "x < 7, so the greatest integer is 6."], ["7", false, "Edge check: 2(7) − 3 = 11, which is not less than 11."], ["8", false, "Too big."], ["14", false, "That's 11 + 3."]]}, {"q": "y = 3x + 2 and 6x − 2y = c. For which value of c does the system have infinitely many solutions?", "ch": [["4", false, "That gives parallel lines: no solution."], ["−4", true, "6x − 2(3x + 2) = −4, so c = −4 makes the same line."], ["2", false, "Parallel lines: no solution."], ["−2", false, "Parallel lines: no solution."]]}, {"q": "Which line has slope −½ and passes through (4, 1)?", "ch": [["y = −½x + 1", false, "Check: −2 + 1 = −1, not 1."], ["y = −½x − 1", false, "Check: −2 − 1 = −3."], ["y = −½x + 3", true, "Check: −½(4) + 3 = 1 ✓."], ["y = −½x + 5", false, "Check: −2 + 5 = 3."]]}], "say": "What do you do at an edge number?", "key": "Test the edge number itself. If it doesn't work, step one past it.", "math": true}, {"id": "m5", "part": "DRIVE · Math", "L": "E", "title": "Every minute: use the whole clock", "learn": "<b>Math:</b> 35 minutes for 22 questions ≈ <b>1½ minutes each</b>. <b>R&W:</b> 32 minutes for 27 ≈ <b>1 minute 10 seconds each</b>.<br>Finished early? You rushed. Go back and run <b>V</b> on every answer.<br>Stuck past 3 minutes? <b>Flag it, guess</b> (no penalty for wrong answers), move on, come back.", "hook": "A touchdown drive <b>uses the whole clock</b>.", "how": ["Glance at the clock every 5 questions.", "Never leave a blank.", "Time left at the end = checking time."], "examples": [["Math Module 1: 1 min 15 sec per question → <b>14 of 22</b>.", "Math Module 2: 43 sec per question → 9 of 22, with about 20 minutes unused.", "Same test, same day. The rushed module lost 9 Easy questions."]], "test": [["Practice Test 2 · Math Module 2", "22 questions in 35 minutes.", "43 seconds each, 13 wrong", "About 1½ minutes each, checking every answer", "Using the extra 20 minutes to verify would likely have saved several Easy questions."]], "drills": [{"q": "About how long should each Math question take on average?", "ch": [["30 seconds", false, "Way too fast. That's how Easy questions get missed."], ["1 minute", false, "Still rushing."], ["3 minutes", false, "Too slow: you'd run out of time."], ["about 1½ minutes", true, "35 ÷ 22 ≈ 1.6 minutes."]]}, {"q": "You reach the end of a Math module with 18 minutes left. What is the best move?", "ch": [["Go back and plug in or Desmos-check every answer", true, "Time left = checking time."], ["Submit right away", false, "Wastes 18 minutes of checking."], ["Change answers you aren't sure about without checking", false, "Changing without a reason often makes it worse."], ["Rest until time runs out", false, "Same as submitting."]]}, {"q": "A question has taken 3 minutes and you are stuck. What should you do?", "ch": [["Keep working until you solve it", false, "Costs time for 2 or 3 other questions."], ["Flag it, pick your best guess, move on, and come back later", true, "No penalty for guessing. Save time for questions you can get."], ["Leave it blank", false, "Blanks are always wrong. Guess."], ["Restart the module", false, "Not possible, and not helpful."]]}], "say": "How long per Math question, and what do you do with extra time?", "key": "About 1½ minutes. Extra time = go back and verify every answer.", "math": true}, {"id": "t1", "part": "Math traps", "L": "1", "title": "Lines, slopes, tables and how many solutions", "learn": "• Slope of <b>Ax + By = C</b> is <b>−A ÷ B</b>.<br>• <b>Perpendicular</b>: flip the fraction <b>and</b> switch the sign.<br>• <b>x-intercept</b>: set y = 0. <b>y-intercept</b>: set x = 0.<br>• Slope from a table: change in y ÷ change in x. Pick rows where the letters cancel.<br>• <b>How many solutions</b> (ax + b = cx + d): different x-numbers → <b>one</b>; same x-number, different constants → <b>none</b>; everything the same → <b>infinitely many</b>.", "hook": "Perpendicular = <b>flip and switch</b>, like a reverse on a kick return.", "how": ["Get the slope (−A ÷ B or from two points).", "Perpendicular? Flip and switch.", "Intercepts: plug in 0 for the other letter."], "examples": [["2y + 8x = 11 → slope −8 ÷ 2 = −4 → perpendicular <b>+¼</b>.", "4", "Switched the sign but didn't flip."], ["h(x) = 7x + 14: x-intercept 7x + 14 = 0 → x = −2; y-intercept 14 → c + d = <b>12</b>.", "16", "Used +2 for the x-intercept."], ["Table (−17, m + 23), (0, m + 46): slope = 23 ÷ 17, starts at m + 46 → y = <b>(23/17)x + m + 46</b>.", "y = 2x + m + 23", "Use rows where m cancels: (m + 46) − (m + 23) = 23."], ["Table (−g, 35), (g, 25), (3g, 15): slope = −10 ÷ 2g = −5/g → <b>5x + gy = 30g</b>. Check (g, 25): 5g + 25g = 30g ✓.", "gx + 5y = 30g", "Check (g, 25): g² + 125 ≠ 30g."], ["−365x + k = 365x + k → x-numbers differ → <b>one solution</b> (x = 0).", "No solutions", "The matching k's are a decoy."]], "test": [["Math Module 2 · Q10", "2y + 8x = 11. Slope of a perpendicular line?", "4", "¼", "Flip and switch: −4 → +¼."], ["Math Module 2 · Q6", "h(x) = 7x + 14, x-int (c, 0), y-int (0, d). c + d?", "16", "12", "c = −2, d = 14."], ["Math Module 1 · Q16", "Linear table with m. Which equation?", "y = 2x + m + 23", "y = (23/17)x + m + 46", "Slope 23/17, y-intercept m + 46."], ["Math Module 2 · Q21", "Table (−g, 35), (g, 25), (3g, 15). Which equation?", "gx + 5y = 30g", "5x + gy = 30g", "Plug in a row to check. (20 seconds on a Hard one.)"], ["Nov 12 question bank", "−365x + k = 365x + k. How many solutions?", "No solutions", "One solution", "Different x-numbers → one."]], "drills": [{"q": "Line: 3x + 6y = 10. What is the slope of a line perpendicular to it?", "ch": [["−2", false, "Flipped but didn't switch the sign."], ["½", false, "Switched the sign but didn't flip."], ["2", true, "Slope = −3 ÷ 6 = −½. Flip and switch → 2."], ["−½", false, "That's the original slope."]]}, {"q": "g(x) = 4x − 12 has x-intercept (c, 0) and y-intercept (0, d). What is c + d?", "ch": [["15", false, "Used +12 for d."], ["−15", false, "Used −3 for c."], ["9", false, "Signs flipped."], ["−9", true, "c: 4x − 12 = 0 → 3. d = −12. 3 + (−12) = −9."]]}, {"q": "5x + 9 = 5x + 2. How many solutions?", "ch": [["None", true, "Same x-number (5), different constants (9 vs. 2) → none."], ["Exactly one", false, "Needs different x-numbers."], ["Exactly two", false, "A linear equation never has exactly two."], ["Infinitely many", false, "Needs the constants to match too."]]}, {"q": "A table shows (0, 7), (2, 13), (4, 19). Which equation fits?", "ch": [["y = 6x + 7", false, "Change in y is 6, but over 2 steps of x."], ["y = 3x + 7", true, "Slope = 6 ÷ 2 = 3; starts at 7."], ["y = 3x + 13", false, "Check (0, 7): 13 ≠ 7."], ["y = 7x + 3", false, "Swapped slope and start."]]}], "say": "Explain perpendicular slope and the 3 cases for how many solutions.", "key": "Flip and switch. Different x-numbers: one. Same x, different constants: none. All the same: infinitely many.", "math": true}, {"id": "t2", "part": "Math traps", "L": "2", "title": "Exponents and equivalent expressions", "learn": "• a · b<sup>x</sup>: b &lt; 1 decreasing, b &gt; 1 increasing.<br>• In a · 2<sup>t/k</sup>, it <b>doubles every k</b>.<br>• Table test: <b>same ratio</b> each step (divide) = exponential. <b>Same difference</b> (subtract) = linear.<br>• f(x) = a · b<sup>x − h</sup> shows <b>f(h) = a</b> as the coefficient.<br>• Equivalent expressions: <b>factor out the common chunk</b> first.", "hook": "Linear adds the same yards each play. Exponential <b>multiplies</b>.", "how": ["Exponential? Find the base and the number under t.", "Table? Divide neighbors, then subtract neighbors.", "Expression? Factor the repeated chunk."], "examples": [["40,000 · 2<sup>m/410</sup> doubles every <b>410</b> minutes.", "820", "The number under m is the doubling time."], ["3967, 2422, 1443, 861: each is about 0.6 × the last → <b>decreasing exponential</b>.", "Decreasing linear", "The differences (1545, 979, 582) aren't equal, so it isn't linear."], ["[3x(x − 8) − 9(x − 8)] ÷ (2x − 16) = (x − 8)(3x − 9) ÷ 2(x − 8) = <b>(3x − 9)/2</b>.", "(3x² − 9x − 16)/(2x − 16)", "Factor (x − 8) out of the top. (12 seconds.)"], ["f(2) = c shows as the coefficient when the exponent is x − 2: <b>45(3)<sup>x−2</sup></b>.", "15(3)<sup>x−1</sup>", "That shows f(1) = 15."]], "test": [["Math Module 2 · Q7", "f(m) = 40,000(2)^(m/410). Doubling time?", "820", "410", "The number under m."], ["Math Module 1 · Q6", "Table 3967, 2422, 1443, 861. Which kind of function?", "Decreasing linear", "Decreasing exponential", "Same ratio, not same difference."], ["Math Module 2 · Q8", "[3x(x − 8) − 9(x − 8)] ÷ (2x − 16)", "(3x² − 9x − 16)/(2x − 16)", "(3x − 9)/2", "Factor first."], ["Math Module 2 · Q22", "Which form shows f(2) = c as the coefficient?", "15(3)^(x−1)", "45(3)^(x−2)", "Exponent x − 2 → coefficient = f(2). (10 seconds on a Hard one.)"]], "drills": [{"q": "P(t) = 800(2)<sup>t/6</sup>, where t is in hours. How many hours does it take P to double?", "ch": [["2", false, "That's the base."], ["12", false, "That's two doublings."], ["6", true, "The number under t."], ["800", false, "That's the starting amount."]]}, {"q": "A table shows x = 1, 2, 3, 4 and y = 5, 15, 45, 135. Which describes it?", "ch": [["Increasing linear", false, "Differences 10, 30, 90 aren't equal."], ["Decreasing exponential", false, "The values go up."], ["Decreasing linear", false, "The values go up and it isn't linear."], ["Increasing exponential", true, "Each y is 3 × the last."]]}, {"q": "Which is equivalent to [5x(x + 3) − 2(x + 3)] ÷ (x + 3), where x ≠ −3?", "ch": [["5x − 2", true, "Factor: (x + 3)(5x − 2) ÷ (x + 3) = 5x − 2."], ["5x + 3", false, "Didn't factor correctly."], ["5x² − 2", false, "Dropped part of the top."], ["3x", false, "Subtracted instead of factoring."]]}, {"q": "g(x) = 2(5)<sup>x</sup>. Which equivalent form shows the value of g(3) as the coefficient?", "ch": [["10(5)<sup>x−1</sup>", false, "Shows g(1) = 10."], ["250(5)<sup>x−3</sup>", true, "g(3) = 2 · 125 = 250, and exponent x − 3 shows it."], ["50(5)<sup>x−2</sup>", false, "Shows g(2) = 50."], ["2(5)<sup>x</sup>", false, "Shows g(0) = 2."]]}], "say": "How do you tell linear from exponential in a table?", "key": "Divide neighbors: same ratio means exponential. Subtract: same difference means linear.", "math": true}, {"id": "t3", "part": "Math traps", "L": "3", "title": "Circles, volume and trig", "learn": "• Circle: <b>d = 2r</b>, <b>A = πr²</b>, <b>C = πd = 2πr</b>. Multiply r by k → area × <b>k²</b>.<br>• Cone volume = <b>⅓ × base area × h</b> (on the reference sheet).<br>• Right triangle: the acute angles add to <b>90°</b>, and <b>sin of one = cos of the other</b>.<br>• Radians → degrees: replace <b>π with 180</b>.", "hook": "Area <b>squares</b> the change: double the field's width and length and you need 4× the turf.", "how": ["Write the formula from the reference sheet.", "Plug in. Watch the ⅓.", "Check the FIND: r or d? degrees?"], "examples": [["Cone: 3,500π = ⅓ · 700π · h → h = <b>15</b>.", "5", "Forgot the ⅓."], ["sin X ÷ cos Y = 1 → sin X = cos Y → X + Y = 90 → X = 90 − 27 = <b>63</b>.", "27", "sin = cos means the angles are complementary, not equal."], ["r doubles → area × <b>4</b>. Area 64π → d = <b>16</b>. d = 12 → C = <b>12π</b>. r = 7 → A = <b>49π</b>.", "× 2 · 8 · 144π · 98π", "Your Friday circle answers (7–23 seconds each)."], ["11π/12 radians = 11 × 180 ÷ 12 = <b>165°</b>.", "2.879", "That's the radians as a decimal, not degrees."]], "test": [["Math Module 2 · Q15", "Cone: volume 3,500π, base area 700π. Height?", "5", "15", "V = ⅓Bh."], ["Math Module 1 · Q18", "Y = 27°, sin X ÷ cos Y = 1. X?", "27", "63", "Complementary angles. (25 seconds.)"], ["Nov 13 question bank", "Circles: diameter from area, circumference, area when r doubles, area from r", "8, 144π, ×2, 98π", "16, 12π, ×4, 49π", "All 5 answered in about a minute."]], "drills": [{"q": "A cone has volume 400π and base area 100π. What is its height?", "ch": [["4", false, "Forgot the ⅓."], ["3", false, "Divided the wrong way."], ["12", true, "400π = ⅓ · 100π · h → h = 12."], ["36", false, "Multiplied by 3 twice."]]}, {"q": "In a right triangle, acute angles A and B satisfy sin A = cos 38°. What is A?", "ch": [["38°", false, "That's the other angle."], ["142°", false, "Used 180 instead of 90."], ["90°", false, "That's the right angle."], ["52°", true, "sin A = cos B means A + B = 90 → A = 52."]]}, {"q": "A circle's radius is tripled. Its area is multiplied by:", "ch": [["9", true, "3² = 9."], ["3", false, "Area squares the change."], ["6", false, "Doubled instead of squared."], ["27", false, "That's for volume (cubed)."]]}, {"q": "What is 5π/6 radians in degrees?", "ch": [["2.618", false, "That's the radians as a decimal."], ["150", true, "5 × 180 ÷ 6 = const L = ['A','B','C','D'];
const STEPS = ['Learn','Examples','Your test','Drill','Say it'];
const store = {get(){try{return JSON.parse(localStorage.getItem('satdz')||'{}')}catch(e){return {}}}, set(v){try{localStorage.setItem('satdz',JSON.stringify(v))}catch(e){}}};
let cur=0, step=0, exN=1, tqShown={}, dr=null, saidShown=false;

function prog(){const s=store.get();const m=C.filter(c=>s[c.id]&&s[c.id].mastered).length;
 document.getElementById('plab').textContent=m+' of '+C.length+' mastered';document.getElementById('pbar').style.width=(100*m/C.length)+'%';
 const parts=[...new Set(C.map(c=>c.part))];
 document.getElementById('groups').innerHTML=parts.map(p=>'<div class="grp"><div class="lab">'+p+'</div><div class="chips">'+
  C.map((c,i)=>c.part!==p?'':`<button class="chip${c.math?' m':''}${s[c.id]&&s[c.id].mastered?' done':''}${i===cur?' now':''}" data-go="${i}"><b>${c.L}</b>${c.title.split(':')[0]}</button>`).join('')+'</div></div>').join('');}

function open(i,st){cur=i;step=st||0;exN=1;tqShown={};dr=null;saidShown=false;render();prog();}

function head(c){return `<div class="top"><div class="big${c.math?' m':''}">${c.L}</div><div><div class="part">${c.part}</div><h2>${c.title}</h2></div></div>
 <div class="steps">${STEPS.map((s,i)=>`<button class="${i===step?'on':(i<step?'fin':'')}" data-step="${i}">${i+1} · ${s}</button>`).join('')}</div>`;}

function render(){
 const c=C[cur], m=document.getElementById('main'); let h=head(c);
 if(step===0){
  h+=`<div class="box ${c.math?'b-math':'b-def'}"><span class="lab">The rule</span><p>${c.learn}</p></div>
   <div class="box b-ok"><span class="lab">Memory hook</span><p>${c.hook}</p></div>
   <div class="box b-rem"><span class="lab">Do this every time</span><ol class="how">${c.how.map(x=>'<li>'+x+'</li>').join('')}</ol></div>
   <div class="actions"><button class="btn" data-step="1">See examples</button></div>`;
 } else if(step===1){
  h+=c.examples.slice(0,exN).map(([ok,no,why],i)=>`<div class="ex fade"><span class="lab muted">Example ${i+1} of ${c.examples.length}</span><div class="ok">${ok}</div><div class="no">${no}</div><div class="why">${why}</div></div>`).join('');
  h+=`<div class="actions">${exN<c.examples.length?'<button class="btn" id="moreex">Next example</button>':'<button class="btn" data-step="2">Your test misses</button>'}</div>`;
 } else if(step===2){
  h+=`<p class="muted" style="margin:0">Read the question. <b>Say the right answer out loud first</b>, then tap to check.</p>`;
  h+=c.test.map(([where,q,his,right,why],i)=>`<div class="tq"><span class="where">${where}</span><div>${q}</div><div class="his">${his}</div>${tqShown[i]?`<div class="box b-ok fade"><span class="lab">Right answer</span><p><b>${right}</b>. ${why}</p></div>`:`<div><button class="btn ghost" data-tq="${i}">Show the right answer</button></div>`}</div>`).join('');
  h+=`<div class="actions"><button class="btn" data-step="3">Start the drill</button></div>`;
 } else if(step===3){
  if(!dr) dr={i:0,tried:[],first:[],done:false};
  if(dr.i>=c.drills.length){
   const sc=dr.first.filter(Boolean).length, n=c.drills.length, s=store.get(); s[c.id]=Object.assign(s[c.id]||{},{drill:sc,of:n}); s[c.id].mastered=(sc===n&&s[c.id].said)||false; store.set(s); prog();
   h+=`<div class="dots">${dr.first.map(f=>`<span class="dot ${f?'ok':'miss'}"></span>`).join('')}</div>
    <div class="score">${sc}/${n}</div><div class="lab muted">right on the first try</div>
    ${sc===n?'<div class="box b-ok"><span class="lab">Clean drill</span><p>Every one on the first try. Now say the rule out loud.</p></div>':'<div class="box b-rem"><span class="lab">Almost</span><p>Read the rule again, then redo the drill. Mastery needs every one on the first try.</p></div>'}
    <div class="actions">${sc<n?'<button class="btn" id="redo">Redo the drill</button><button class="btn ghost" data-step="0">Read the rule again</button>':'<button class="btn" data-step="4">Say it</button>'}</div>`;
  } else {
   const q=c.drills[dr.i], last=dr.tried[dr.tried.length-1], solved=dr.tried.some(t=>q.ch[t][1]);
   h+=`<div class="dots">${c.drills.map((_,j)=>`<span class="dot ${j<dr.i?(dr.first[j]?'ok':'miss'):(j===dr.i?'now':'')}"></span>`).join('')}</div>
    <p class="q">${q.q}</p><div class="opts">${q.ch.map((ch,j)=>{const x=dr.tried.includes(j)&&!ch[1], ok=solved&&ch[1];
     return `<button class="opt${x?' x':''}${ok?' right':''}" data-a="${j}" ${solved||x||dr.lock?'disabled':''}><span class="L">${L[j]}</span><span class="T">${ch[0]}</span></button>`}).join('')}</div>`;
   if(last!==undefined && !q.ch[last][1]) h+=`<div class="box b-trap fade"><span class="lab">${L[last]} is a trap</span><p>${q.ch[last][2]}</p></div>${dr.lock?'<div class="actions"><button class="btn" id="unlock">I read why. Let me try again</button></div>':''}`;
   if(solved) h+=`<div class="box b-ok fade"><span class="lab">${dr.tried.length===1?'Right on the first try':'Got it'}</span><p>${q.ch[last][2]}</p></div><div class="actions"><button class="btn" id="nextq">${dr.i+1<c.drills.length?'Next question':'See my score'}</button></div>`;
  }
 } else {
  h+=`<div class="box b-rem"><span class="lab">Say it out loud</span><p><b>${c.say}</b><br>Then give a football or real-life example of the rule.</p></div>`;
  h+= saidShown?`<div class="box b-ok fade"><span class="lab">You should have said</span><p>${c.key}</p></div><div class="actions"><button class="btn" id="said">I said it right</button><button class="btn ghost" data-step="0">I missed part. Show the rule</button></div>`
     :`<div class="actions"><button class="btn" id="showsay">Check what I said</button></div>`;
 }
 m.innerHTML=h; m.classList.remove('fade'); void m.offsetWidth; m.classList.add('fade');
}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const c=C[cur];
 if(b.dataset.go!==undefined){location.hash=C[+b.dataset.go].id;document.getElementById('nav').open=false;return}
 if(b.dataset.step!==undefined){step=+b.dataset.step;if(step===3)dr=null;render();window.scrollTo({top:0});return}
 if(b.id==='moreex'){exN++;render();return}
 if(b.dataset.tq!==undefined){tqShown[b.dataset.tq]=1;render();return}
 if(b.dataset.a!==undefined){const j=+b.dataset.a,q=c.drills[dr.i];dr.tried.push(j);
  if(q.ch[j][1]){dr.first[dr.i]=dr.tried.length===1}else{dr.lock=true}render();return}
 if(b.id==='unlock'){dr.lock=false;render();return}
 if(b.id==='nextq'){dr.i++;dr.tried=[];dr.lock=false;render();window.scrollTo({top:0});return}
 if(b.id==='redo'){dr=null;render();return}
 if(b.id==='showsay'){saidShown=true;render();return}
 if(b.id==='said'){const s=store.get();s[c.id]=Object.assign(s[c.id]||{},{said:true});s[c.id].mastered=!!(s[c.id].of&&s[c.id].drill===s[c.id].of);store.set(s);prog();
  const nx=cur+1<C.length?cur+1:0; const m=document.getElementById('main');
  m.innerHTML=head(c)+`<div class="box b-ok fade"><span class="lab">${s[c.id].mastered?'Mastered':'Saved'}</span><p>${s[c.id].mastered?'Concept mastered.':'You said it. Finish the drill with every one right to master it.'}</p></div><div class="actions"><button class="btn" data-go="${nx}">Next: ${C[nx].L} · ${C[nx].title.split(':')[0]}</button></div>`;return}
});
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toUpperCase();let n='1234'.indexOf(k);if(n<0)n='ABCD'.indexOf(k);if(n<0||step!==3)return;
 const bs=[...document.querySelectorAll('#main .opt')];if(bs[n]&&!bs[n].disabled)bs[n].click();});
function route(){const id=location.hash.slice(1);const i=C.findIndex(c=>c.id===id);open(i<0?0:i,0);window.scrollTo({top:0});}
window.addEventListener('hashchange',route);route();
</script></body></html>
