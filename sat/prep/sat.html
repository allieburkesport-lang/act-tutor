<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT HELM</title>
<style>
:root{--ink:#111827;--mute:#4b5563;--line:#e5e7eb;--navy:#1e3a8a;--navy2:#eef2ff;--bg:#f6f7f9;--or:#c2410c}
*{box-sizing:border-box}
body{margin:0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:#1d4ed8}a:hover{color:var(--navy)}
button{font:inherit;cursor:pointer}
.hd{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.btn{font-weight:700;padding:10px 16px;min-height:44px;border-radius:10px;border:0;background:var(--navy);color:#fff}
.btn.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.g{background:#fff;color:var(--ink);border:1px solid #d1d5db;font-weight:600}
.btn.sm{padding:8px 12px;font-size:14px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
/* top header (home + learn + video) */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .in{padding:16px 3vw;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.logo{width:42px;height:42px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.nav a{padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:600;color:#374151}
.nav a.on{background:var(--navy2);color:var(--navy)}
.page{padding:26px 3vw 60px;display:flex;flex-direction:column;gap:22px}
.today{background:var(--navy);color:#fff;border-radius:16px;padding:22px 26px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.today .k{font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#c7d2fe}
.today .t{font-size:27px;font-weight:700;margin-top:4px}
.today .s{font-size:16px;color:#e0e7ff;margin-top:4px;max-width:900px}
.today .btn{background:#fff;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.stat{padding:16px 18px}.stat .l{font-size:14px;color:var(--mute)}.stat .v{font-size:30px;font-weight:700;margin-top:4px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.sec h2{margin:0;font-size:22px}
.sec .h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.1fr) 150px auto;gap:12px;padding:11px 20px;align-items:center;border-top:1px solid #f1f2f4}
.row.hd2{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mute);background:#f9fafb;border-top:0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.row .nm{font-weight:600}
.bar{flex:1;height:8px;background:#eef0f3;border-radius:4px;overflow:hidden}.bar i{display:block;height:8px;background:var(--navy)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:1250px){.cols{grid-template-columns:1fr}}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:1fr 1fr}.row.hd2{display:none}.acts{justify-content:flex-start;grid-column:1/-1}}
/* drill (SAT style) */
.dr{min-height:100vh;display:flex;flex-direction:column;background:#fff}
.dr .bar1{border-bottom:2px dashed #d1d5db;padding:10px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.dr .timer{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:22px;font-weight:700}
.dr .body{display:flex;flex:1;min-height:0}
.dr main{flex:1 1 560px;min-width:0;padding:26px 40px;overflow:auto}
.qcol{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;align-items:center;justify-content:space-between;background:#f3f4f6;border-radius:6px;padding-right:12px}
.qnum{background:var(--ink);color:#fff;font-weight:700;padding:9px 15px;border-radius:6px 0 0 6px}
.mark{background:transparent;border:0;padding:10px 6px;min-height:44px;color:var(--ink)}
.help{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.help .b{font-weight:700;font-size:15px;padding:8px 16px;min-height:44px;border-radius:22px;background:#fff;color:var(--navy);border:1px solid var(--navy)}
.help .b.on{background:var(--navy);color:#fff}
.passage{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:19px;line-height:1.6;border-left:3px solid #e5e7eb;padding-left:16px}
.qtext{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.55}
.qtext .stem,.stem{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:19px;margin-top:10px}
.rem{margin:12px 0 14px;padding:10px 14px;border-left:4px solid #C62828;background:#FDECEC;color:#B71C1C;font-size:17px;line-height:1.45}.rem div+div{margin-top:6px}
.qtext table{border-collapse:collapse;margin:8px 0}.qtext td,.qtext th{border:1px solid #9ca3af;padding:4px 10px}
.ch{display:flex;flex-direction:column;gap:12px}
.ch button{text-align:left;display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:58px;border:1.5px solid #9ca3af;border-radius:10px;background:#fff}
.ch button .L{flex:0 0 32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.ch button .t{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:19px}
.ch button.right{border:2.5px solid #15803d;background:#f0fdf4}.ch button.right .L{background:#15803d;color:#fff;border-color:#15803d}
.ch button.wrong{border:2px solid #c2410c;background:#fff7ed;opacity:.75}.ch button.wrong .t{text-decoration:line-through}.ch button.wrong .L{background:#c2410c;color:#fff;border-color:#c2410c}
.ch button:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 16px;font-size:16px}
.fb.ok{background:#f0fdf4;border:1px solid #86efac;color:#14532d}.fb.no{background:#fff7ed;border:1px solid #fdba74;color:#7c2d12}
.grid-in{display:flex;gap:10px;align-items:center}.grid-in input{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;width:200px}
.dr footer{border-top:2px dashed #d1d5db;padding:10px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.nb{font-weight:700;padding:10px 24px;min-height:44px;border-radius:22px;border:0;background:var(--navy);color:#fff}
.nb:disabled{opacity:.4;cursor:default}
.qn{font-weight:700;padding:9px 16px;min-height:44px;border-radius:8px;border:0;background:var(--ink);color:#fff}
.navgrid{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:16px;display:flex;gap:8px;flex-wrap:wrap;max-width:520px;z-index:20}
.navgrid button{width:44px;height:44px;border-radius:8px;border:1.5px dashed #9ca3af;background:#fff;font-weight:700}
.navgrid button.ok{border:2px solid #15803d;color:#15803d}.navgrid button.no{border:2px solid #c2410c;color:#c2410c}.navgrid button.cur{outline:3px solid var(--navy)}
/* right panel */
aside.pan{flex:0 0 min(560px,40vw);border-left:1px solid var(--line);background:#fafafa;padding:20px 22px 30px;overflow:auto;display:flex;flex-direction:column;gap:14px}
aside.pan .ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
aside.pan .ph .t{font-size:21px;font-weight:700}aside.pan .ph .s{font-size:14px;color:var(--mute);margin-top:2px}
.x{width:44px;height:44px;border-radius:8px;border:1px solid #d1d5db;background:#fff;font-size:18px;flex:0 0 44px}
.box{border-radius:10px;padding:12px 14px;border:1px solid}
.box .lab{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.box .c{margin-top:6px;font-size:16px;line-height:1.55}
.b-blue{background:#eef2ff;border-color:#c7d2fe}.b-blue .lab{color:#1e3a8a}
.b-green{background:#f0fdf4;border-color:#bbf7d0}.b-green .lab{color:#14532d}
.b-yel{background:#fefce8;border-color:#fde68a}.b-yel .lab{color:#854d0e}
.b-red{background:#fff1e6;border-color:#fdba74}.b-red .lab{color:#9a3412}
.b-pur{background:#faf5ff;border-color:#e9d5ff}.b-pur .lab{color:#6b21a8}
.dk-box{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 14px}
.dk-step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.5}.dk-step:last-of-type{border-bottom:0}
.dk-n{flex:none;width:26px;height:26px;border-radius:50%;background:#13315C;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.dk-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.dk{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:34px;padding:0 9px;border:1.5px solid #94a3b8;border-bottom-width:4px;border-radius:8px;background:#f8fafc;font:700 18px Helvetica,Arial,sans-serif;color:#0f172a}
.dk.sp{background:#fef3c7;border-color:#d97706;color:#7c2d12}
.dk-see{font-size:14px;color:var(--mute)}
.dk-keys{margin:4px 0 10px;background:#fffbeb;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.dsx-tb{border-collapse:collapse;font-size:18px;margin:2px 0}.dsx-tb th,.dsx-tb td{border:1px solid #cfcfcf;padding:5px 18px;text-align:center;min-width:60px}.dsx-tb th{background:#f3f3f3;font-weight:400;text-transform:none!important}
.dsx-dot.sm{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.dsx-par b+b{margin-left:4px}
.dsx-live{width:100%;height:540px;border:1.5px solid #cfcfcf;border-radius:12px;overflow:hidden;background:#fff}
.dw-how{background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.55}
.dw-how-h{font-weight:700;color:#166534;margin-bottom:4px}
.dw-more{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}.dw-more summary{cursor:pointer;font-weight:700;font-size:15px;color:var(--mute)}.dw-more[open] summary{margin-bottom:8px}
.dw-lab2{font-size:14px;font-weight:700;color:var(--mute);margin-top:4px}
.dsx{border:1.5px solid #cfcfcf;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.dsx-list{border-bottom:1.5px solid #ddd;font-family:Helvetica,Arial,sans-serif}
.dsx-r{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid #e8e8e8;padding:10px 12px 10px 0;min-height:44px}
.dsx-r:last-child{border-bottom:0}
.dsx-n{width:30px;flex:none;text-align:center;font-size:11px;color:#999;background:#f3f3f3;align-self:stretch;margin:-10px 0;padding-top:12px}
.dsx-dot{width:18px;height:18px;border-radius:50%;flex:none;margin-top:3px}
.dsx-c{flex:1}.dsx-e{font-size:21px;color:#111}
.dsx-par{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11px;letter-spacing:.06em;color:#777}
.dsx-par b{font-size:18px;letter-spacing:0;color:#111;font-weight:400;border:1px solid #ddd;border-radius:6px;padding:3px 10px;background:#fafafa}
.dw{display:flex;flex-direction:column;gap:10px;font-family:Helvetica,Arial,sans-serif;color:var(--ink)}
.dw-p{font-size:17px;line-height:1.5}
.dw-h{font-size:21px;font-weight:700;margin-top:10px}
.dw-m{font-size:24px;text-align:center;margin:4px 0;letter-spacing:.01em}
.dw-mi{font-weight:600;white-space:nowrap}
.dw-ul{margin:0;padding-left:22px;font-size:17px;line-height:1.7}
.dw-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:6px 18px}
.dw-row{padding:14px 0;border-bottom:1px solid var(--line)}.dw-row:last-child{border-bottom:0}
.dw-lab{font-size:14px;color:var(--mute)}
.dw-big{font-size:30px;margin-top:6px}
.dw-keys{font-size:13px;color:var(--mute);margin-top:4px}.dw-keys code{font-family:Menlo,Consolas,monospace;font-size:14px;color:var(--ink);background:#f1f5f9;border-radius:5px;padding:1px 6px}
.dw-res{font-size:38px;color:#15803d;margin-top:4px}
.dw-note{font-size:15px;margin-top:6px}
.dw-ans{font-size:19px;font-weight:700}
.dw-box{border:2px solid var(--ink);padding:2px 12px}
.dw-t{border-collapse:collapse;width:100%;font-size:16px}.dw-t th{text-align:left;font-size:13px;padding:8px 6px;border-bottom:1.5px solid var(--line)}.dw-t td{padding:10px 6px;border-bottom:1px solid var(--line)}
.step{display:flex;flex-wrap:wrap;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.step .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.step .c{font-size:16px;line-height:1.55}
.co{color:#9a3412;background:#ffedd5;border-bottom:2px solid #ea580c;padding:0 3px;border-radius:3px;font-weight:700}
.cot{font-size:11px;font-weight:700;color:#fff;background:var(--or);border-radius:9px;padding:1px 7px;margin-left:3px;vertical-align:2px;white-space:nowrap}
.vid{aspect-ratio:16/9;width:100%;border-radius:10px;background:#000}
.vph{aspect-ratio:16/9;background:#2b3a33;border:8px solid #8a5a2b;border-radius:10px;display:grid;place-items:center;color:#f5f5dc;text-align:center;padding:16px}
iframe.desmos{width:100%;height:calc(100vh - 190px);border:1px solid var(--line);border-radius:10px;background:#fff}
@media (max-width:1000px){.dr .body{flex-direction:column}aside.pan{flex:none;border-left:0;border-top:1px solid var(--line)}.dr main{padding:20px}}
@media (min-width:1600px){.qcol{max-width:900px}.qtext{font-size:22px}.passage,.ch button .t{font-size:21px}}
/* lesson page */
.lframe{width:100%;height:calc(100vh - 160px);border:1px solid var(--line);border-radius:14px;background:#fff}
.end{max-width:640px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.sched{width:100%;border-collapse:collapse;font-size:15px}.sched th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:10px 12px;border-bottom:2px solid #e5e7eb}
.mxg{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;margin:2px 0 6px}.sched tr.mxrow td{cursor:default;padding:4px 14px 16px!important}.mxb{border:1px solid #E4E4E7;border-radius:10px;overflow:hidden;background:#fff}
.mxh{font-weight:800;font-size:17px;letter-spacing:.04em;padding:8px 12px;background:#F4F6FA;border-bottom:1px solid #E4E4E7}.mxh span{font-weight:600;color:#1D4ED8;letter-spacing:0;margin-left:6px}
table.mxt{width:100%;border-collapse:collapse;font-size:16px}table.mxt th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#52525B;text-align:center;padding:6px 8px;border-bottom:1px solid #E4E4E7}
table.mxt td{border-left:0!important;box-shadow:none!important;background:#fff!important;padding:9px 10px;border-top:1px solid #F1F2F4;text-align:center;white-space:nowrap}table.mxt td:first-child,table.mxt th:first-child{text-align:left;white-space:normal;min-width:170px}table.mxt tr.rot td{color:#6B7280}
.sched td{font-size:16px;padding:11px 12px;border-top:1px solid #f1f2f4;vertical-align:top}.sched tr.click{cursor:pointer}.sched tr.click:hover td{background:#f6f8fc}.sched tr.now td{background:#eef3ff}.sched tr.owed td{background:#fff4f4}.sched tr.owed td:first-child{box-shadow:inset 4px 0 0 #9b1c1c}.sched tr.now td:first-child{box-shadow:inset 4px 0 0 var(--navy)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef0f3;color:#374151;margin-right:6px}.tag.learn{background:#e8efff;color:#1e40af}.tag.test{background:#fff1e6;color:#9a3412}.tag.weak{background:#fde8e8;color:#9b1c1c}.tag.light{background:#e7f6ec;color:#14532d}.tag.sat{background:var(--navy);color:#fff}
.rep{width:100%;border-collapse:collapse;font-size:14px}.rep th{text-align:left;font-size:12px;color:var(--mute);padding:8px 10px;border-bottom:2px solid #e5e7eb;white-space:nowrap}.rep td{padding:10px;border-top:1px solid #f1f2f4;vertical-align:middle}
.dif span{display:inline-block;margin-right:6px;font-size:13px;white-space:nowrap}.slow{color:#9a3412;font-weight:700}.fast{color:#14532d;font-weight:700}
@media (max-width:900px){.sched .hide,.rep .hide{display:none}}
.wf{flex-basis:100%;margin-top:0;padding:8px 10px;border-radius:8px;background:#f0fdf4;border-left:4px solid #15803d;font-size:14px;line-height:1.5}.wf .wl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#15803d;margin-bottom:2px}
.keepon{font-size:20px;font-weight:700;color:#9a3412;background:#fff4ec;border:1px solid #fed7aa;border-radius:10px;padding:10px 16px}.keepon.ok{color:#14532d;background:#ecfdf3;border-color:#bbf7d0}.keepon.sm{font-size:13px;padding:4px 8px;margin-bottom:6px;display:block;text-align:center}
.src2{margin:4px 0 0 4px;font-size:13px;line-height:1.5}.src2 .sl{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.src2 .lab{min-width:62px;color:var(--mute);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em}.src2 .mute{color:var(--mute)}.src2 .up{color:#15803d;font-weight:600}.src2 .dn{color:#c2410c;font-weight:600}.src2 .eq{color:var(--mute)}

/* ===== HELM design system (Allie, Nov 22–23): Helvetica everywhere, BI-grade spacing, cool navy/blue/teal palette, no gold ===== */
:root{--ink:#0F172A;--mute:#64748B;--line:#E2E8F0;--line2:#EEF2F6;--bg:#F4F6FA;--navy:#1E3A8A;--navy2:#EEF2FF;--blue:#2563EB;--sky:#0EA5E9;--teal:#0D9488;--or:#C2410C;
  --ok:#059669;--okbg:#ECFDF5;--bad:#DC2626;--badbg:#FEF2F2;--warn:#D97706;--r-lg:16px;--r-md:12px;--r-sm:8px;--sh:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);--sh2:0 8px 24px rgba(15,23,42,.08)}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{font-size:15px;line-height:1.5;letter-spacing:-.003em;font-variant-numeric:tabular-nums}
h1,h2,h3,.hd{letter-spacing:-.018em;font-weight:700;color:var(--ink)}
h1.hd{font-size:30px!important;line-height:1.15}
a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:2px}
.page{width:100%;padding:28px 32px 72px;gap:20px}
/* header */
.top{background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(10px);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line)}
.top .in{padding:10px 32px}
.nav{background:#F1F5F9;border-radius:12px;padding:4px}
.nav a{padding:8px 14px;border-radius:9px;font-size:14px;color:#334155;transition:background .15s,color .15s}
.nav a:hover{background:#fff;color:var(--ink)}
.nav a.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
/* surfaces */
.card,.bi .bc{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
section.card{transition:box-shadow .2s}
.card h2.hd{font-size:18px!important;font-weight:700}
.stats{gap:16px}
.stat{padding:18px 20px}.stat .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.stat .v{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.today{background:linear-gradient(135deg,#1E3A8A 0%,#1D4ED8 100%);border-radius:var(--r-lg);box-shadow:var(--sh2)}
.today .k{color:#BFDBFE}
/* buttons */
.btn{border-radius:10px;font-weight:600;letter-spacing:-.005em;transition:transform .08s,box-shadow .15s,background .15s;box-shadow:0 1px 2px rgba(15,23,42,.12)}
.btn:hover{background:#1E40AF}.btn:active{transform:translateY(1px)}

  return '';}

function drawEnd(){if(D.date){const dt=D.date;dayStore(true);D=null;location.hash='#/report/'+dt;return}if(D.more){const t=D.st.filter(x=>x.tried.length);D.qs=D.qs.filter((q,k)=>D.st[k].tried.length);D.st=t}const n=D.qs.length,first=D.st.filter(t=>t.ok&&t.tried.length===1&&!t.coached).length,miss=D.qs.filter((q,k)=>!(D.st[k].ok&&D.st[k].tried.length===1));
  app().innerHTML=topbar('')+`<div class="end"><h1 class="hd" style="font-size:30px;margin:0">${esc(D.title)}: done</h1><div style="font-size:22px"><b>${first} of ${n}</b> right on the first try</div>
   ${D.skill?(n&&first/n>=.8?`<div class="keepon ok">Mastered for today: ${Math.round(100*first/n)}% right on the first try ✓</div>`:`<div class="keepon">Let's keep drilling until we master this.</div>`):''}
   <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${D.skill?`<button class="btn" data-go="#/drill/more:${D.skill}?${Date.now()}">Keep drilling ${esc(SK2[D.skill].name)}</button>`:''}${miss.length?`<button class="btn o" data-redo="1">Redo the ${miss.length} I missed</button>`:''}${D.skill?`<button class="btn g" data-go="#/learn/${D.skill}">Learn it</button>`:''}<button class="btn g" data-go="#/">Home</button></div></div>`;}

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-go]');if(!b)return;const d=b.dataset;if(d.pause){pauseOn();return}if(d.resume){pauseOff();return}
  if(d.go){const h=d.go.split('?')[0];if(location.hash===h)route();else location.hash=h;return}
  if(d.alldays){UI.allDays=!UI.allDays;return route()}
  if(d.lid){UI.lid=d.lid;return route()}
  if(d.vid){UI.vid=d.vid;if(D&&!D.done)return drawDrill();return route()}
  if(!D)return;
  const q=D.done?null:cur(),st=D.done?null:D.st[D.i];
  if(d.pick!==undefined){const j=+d.pick;if(st.tried.includes(j)||st.ok)return;st.tried.push(j);answer(j===q.ans,q.ch[j]);return}
  if(d.grid)return gridCheck();
  if(d.pan){UI.panel=UI.panel===d.pan?null:d.pan;if(UI.panel){const key=st.tried.length?'ha':'hb';st[key]=st[key]||[];if(!st[key].includes(UI.panel))st[key].push(UI.panel)}if(UI.panel==='show'){st.coached=st.coached||!st.ok;if(!st.shown)st.shown=1}return drawDrill()}
  if(d.dtab){UI.dtab=d.dtab;return drawDrill()}
  if(d.next){st.shown=(st.shown||1)+1;return drawDrill()}
  if(d.seek){UI.seek=+d.seek;const v=document.querySelector('video');if(v){v.currentTime=+d.seek;v.play().catch(()=>{})}return}
  if(d.mark){st.mark=!st.mark;return drawDrill()}
  if(d.navg){UI.nav=!UI.nav;return drawDrill()}
  if(d.jump!==undefined){if(+d.jump>D.i&&st&&st.tried.length&&!st.ok)return;D.i=+d.jump;UI.nav=false;UI.dtab=null;return showQ()}
  if(d.mv){if(+d.mv>0&&st&&st.tried.length&&!st.ok)return;const n=D.i+(+d.mv);if(n>=D.qs.length&&D.more){const nx=moreQs(D.more,D.qs);if(nx.length){D.qs=D.qs.concat(nx);D.st=D.st.concat(nx.map(()=>({tried:[],ok:false,shown:0,t0:0,coached:false})))}}
    if(n>=D.qs.length){D.done=true;return drawEnd()}if(n>=0){D.i=n;dayStore();UI.nav=false;if(UI.panel==='show')UI.panel=null;UI.dtab=null;showQ()}return}
  if(d.stopmore){D.done=true;return drawEnd()}
  if(d.redo){const miss=D.qs.filter((q,k)=>!(D.st[k].ok&&D.st[k].tried.length===1));D={...D,qs:miss,i:0,st:miss.map(()=>({tried:[],ok:false,shown:0,t0:0,coached:false})),t0:Date.now(),done:false,title:D.title+' · redo'};return showQ()}
});
HELM_AUTH.then(s=>{H.Authorization='Bearer '+s.access_token;return load()}).then(route).then(publishSat);
window.addEventListener('hashchange',()=>setTimeout(publishSat,300));
/* ---------- time in SAT HELM ----------
   Counts time while this page is visible AND he is active (a tap, key, scroll or mouse move in the last
   2 minutes, or a video playing). Saved per calendar day ("cal") and per plan day he is working on ("plan"). */
const TIME=Object.assign({cal:{},plan:{}},(window.HELM_PROGRESS&&HELM_PROGRESS.get('sat_time',{}))||{});
let lastAct=Date.now(),lastPlan=null;
['pointerdown','keydown','scroll','mousemove','touchstart','wheel'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));
function curPlanDay(){const m=/#\/(?:day|drill|report)\/(\d{4}-\d\d-\d\d)/.exec(location.hash);return m?m[1]:lastPlan}
setInterval(()=>{const vid=[...document.querySelectorAll('video,audio')].some(v=>!v.paused&&!v.ended);
  if(document.hidden||(!vid&&Date.now()-lastAct>120000))return;
  const c=today(),pd=curPlanDay();TIME.cal[c]=(TIME.cal[c]||0)+15;if(pd)TIME.plan[pd]=(TIME.plan[pd]||0)+15;
  if(window.HELM_PROGRESS)HELM_PROGRESS.put('sat_time',TIME)},15000);
(window.HELM_AUTH||Promise.reject()).then(async()=>{const r=window.HELM_PROGRESS&&await HELM_PROGRESS.pull('sat_time');if(r)['cal','plan'].forEach(k=>Object.keys(r[k]||{}).forEach(d=>{TIME[k][d]=Math.max(TIME[k][d]||0,r[k][d])}))}).catch(()=>{});
const hm=s=>{const m=Math.round((s||0)/60);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min'};

/* Tell the HELM homepage how each SAT HELM plan day is going (saved to helm_progress as "sat_summary"). */
function publishSat(){try{if(!PLAN||!window.HELM_PROGRESS)return;
  const days=PLAN.days.map(d=>{let total=0,n=0;try{total=buildDay(d,true).qs.length;n=dayFirst(d.date).length}catch(e){}
    return {date:d.date,done:!!dayDone(d),answered:Math.min(n,total),total,pct:total?Math.round(100*Math.min(n,total)/total):0}});
  const due=days.filter(d=>d.date<=today()),fin=due.filter(d=>d.done).length;
  HELM_PROGRESS.put('sat_summary',{updated:Date.now(),days,daysDone:days.filter(d=>d.done).length,daysTotal:days.length,dueDone:fin,dueTotal:due.length})}catch(e){}}
setInterval(()=>{if(window.HELM_TOKEN)H.Authorization='Bearer '+window.HELM_TOKEN},60000);
</script>
