.dif span{display:inline-block;margin-right:6px;font-size:13px;white-space:nowrap}.slow{color:#9a3412;font-weight:700}.fast{color:#14532d;font-weight:700}

.keepon{font-size:20px;font-weight:700;color:#9a3412;background:#fff4ec;border:1px solid #fed7aa;border-radius:10px;padding:10px 16px}.keepon.ok{color:#14532d;background:#ecfdf3;border-color:#bbf7d0}.keepon.sm{font-size:13px;padding:4px 8px;margin-bottom:6px;display:block;text-align:center}
.src2{margin:4px 0 0 4px;font-size:13px;line-height:1.5}.src2 .sl{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.src2 .lab{min-width:62px;color:var(--mute);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em}.src2 .mute{color:var(--mute)}.src2 .up{color:#15803d;font-weight:600}.src2 .dn{color:#c2410c;font-weight:600}.src2 .eq{color:var(--mute)}

function srcOf(q){return q.src==='cb'?'cb':BPR.some(b=>b.id===q.id)?'bp':'helm'}
function order(qs){qs=fresh(qs);if(!qs.length)return qs;const sk=qs[0].skill,a=skAcc(sk,today());
  const dpat=a==null||a<.5?['M','E','H','M','M','H']:a<.75?['M','H','E','H','M','H']:['H','M','H','H','E','H'];
  const spat=['cb','helm','cb','helm','bp','cb','helm','cb','helm','bp'];
  const seed=[...(today()+sk)].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7),rnd=i=>((Math.sin(seed+i*97.13)*1e4)%1+1)%1;
  const P={cb:{E:[],M:[],H:[]},helm:{E:[],M:[],H:[]},bp:{E:[],M:[],H:[]}};
  qs.map((q,i)=>[rnd(i),q]).sort((x,y)=>x[0]-y[0]).forEach(([,q])=>{const d=P[srcOf(q)];(d[q.diff]||d.M).push(q)});
  const near={E:['E','M','H'],M:['M','H','E'],H:['H','M','E']};

function carried(q,steps){// numbers found as results in earlier steps and reused later (not given in the question)
  const given=new Set((plain(q.q).match(/-?\d+(?:\.\d+)?/g)||[]));const res=[];
  steps.forEach((s,i)=>{const t=s.replace(/✓/g,'');const k=Math.max(t.lastIndexOf('='),t.lastIndexOf(':'),t.lastIndexOf('→'));const seg=k>=0?t.slice(k+1):'';const m=seg.match(/-?\d+(?:\.\d+)?/);if(m&&!given.has(m[0].replace('-','')) && !given.has(m[0]))res.push([m[0],i])});

function markCarry(text,i,res){let h=esc(text);res.forEach(([v,from])=>{if(from>=i)return;const e=v.replace(/[.\-]/g,'\\$&');const rx=new RegExp('(^|[^0-9.,])('+e+')(?![0-9.])');if(rx.test(h)&&!h.includes('from step '+(from+1)))h=h.replace(rx,`$1<span class="co">$2</span><span class="cot">from step ${from+1}</span>`)});return h}

function givenNums(q){return new Set((plain(q.q).match(/\d+(?:\.\d+)?/g)||[]))}
function pyth(q){const t=plain(q.q).toLowerCase();for(const st of q.steps){const m=st.match(/(\d+(?:\.\d+)?)²\s*\+\s*(\d+(?:\.\d+)?)²/);if(m&&(/hypotenuse|right triangle|right angle|tangent|diagonal|distance|ladder|leg/.test(t)||q.steps.some(x=>x.includes('√'))))return {a:m[1],b:m[2],i:q.steps.indexOf(st)}}return null}
function formulaIntro(q){const p=pyth(q);if(!p)return '';

  for(const m of s.matchAll(/(\d+(?:\.\d+)?)²/g)){const v=+m[1];out.push(`${m[1]}² means ${m[1]} × ${m[1]} = <b>${nfmt(v*v)}</b>`)}

  for(const m of s.matchAll(/(\d+(?:\.\d+)?) \+ (\d+(?:\.\d+)?) = (\d+(?:\.\d+)?)/g)){if(Math.abs(+m[1]+ +m[2]-m[3])<1e-9)out.push(`Add the two squares: ${m[1]} + ${m[2]} = <b>${m[3]}</b>. That is c².`.replace(' That is c².',p&&p.i===i?' That is c².':''))}

function lessonData(skill){const id=lessonFor(skill)[0];return id&&LES[id]}
function formulaBox(skill){const id=lessonFor(skill).find(l=>LES[l]&&LES[l].math);if(!id)return '';const keys=Object.keys(typeof MH!=='undefined'?MH:{}).filter(k=>k.startsWith(id+'|'));
  const seen=new Set(),fs=[];keys.forEach(k=>{const f=MH[k].f;if(Array.isArray(f))f.forEach(x=>{if(!seen.has(x.eq)&&fs.length<4){seen.add(x.eq);fs.push(x)}})});
  if(!fs.length)return '';return `<div class="box b-pur"><div class="lab">Formulas for this skill</div><div class="c">${fs.map(x=>`<b>${esc(x.eq)}</b> <span style="color:var(--mute);font-size:14px">· ${esc(x.n)} (${esc(/Reference/.test(x.frm)?'Reference sheet':'learn it')})</span>`).join('<br>')}</div></div>`}
function panelHTML(){const q=cur(),st=D.st[D.i],s=SK2[q.skill],k=UI.panel;
  const head=(t,sub)=>`<div class="ph"><div><div class="t hd">${t}</div><div class="s">${sub}</div></div><button class="x" aria-label="Close panel" data-pan="${k}">✕</button></div>`;
  if(k==='show'){const res=carried(q,q.steps);const n=Math.max(1,st.shown);
    const seen=new Set();const wfs=q.steps.map((x,i)=>s.sec==='Math'?whereFrom(q,x,i,seen):'');
    return head('Show me how','This question, one step at a time')+(typeof figFor==='function'?figFor(q):'')+(s.sec==='Math'?qCards(q):'')+q.steps.slice(0,n).map((x,i)=>stepHTML(x,i,res,wfs[i])).join('')+
     (n<q.steps.length?`<button class="btn" data-next="1" style="align-self:flex-start">Show the next step (${n+1} of ${q.steps.length})</button>`:`<div class="box b-red"><div class="lab">Trap</div><div class="c">${esc(q.trap)}</div></div>`)+
     `<div class="box b-blue"><div class="lab">${s.sec==='Math'?'Desmos or calculator':'Strategy'}</div><div class="c">${esc(q.tool)}</div></div>`;}

  if(k==='desm'){const h=QH[q.id]||{d:[],c:[]};const tab=UI.dtab||(h.d.length?'d':'c');
    const list=a=>a.map((x,i)=>`<div class="step"><span class="n">${i+1}</span><div class="c">${esc(x)}</div></div>`).join('');
    let b=head('Desmos / calculator','Exactly what to type for this question');
    b+=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ${tab==='d'?'':'g'} sm" data-dtab="d">Desmos</button><button class="btn ${tab==='c'?'':'g'} sm" data-dtab="c">TI-84 Evo calculator</button><button class="btn ${tab==='live'?'':'g'} sm" data-dtab="live">Open real Desmos</button></div>`;
    if(tab==='live')return b+`<iframe class="desmos" src="https://www.desmos.com/calculator" title="Desmos graphing calculator"></iframe>`;
    if(tab==='d'){if(!h.d.length)return b+`<div class="box b-yel"><div class="lab">Desmos can't do this one for you</div><div class="c">This is a rule question, not a calculation. Here is how to solve it:</div></div>`+q.steps.map((x,i)=>`<div class="step"><span class="n">${i+1}</span><div class="c">${x}</div></div>`).join('')+`<div class="box b-green"><div class="lab">Rule</div><div class="c">${esc(q.tool)}</div></div>`;
      return b+(typeof desmosPic==='function'?desmosPic(h.d):'')+`<div class="box b-blue"><div class="lab">Type these, one per line</div><div class="c">Desmos is the Calculator button at the top right of the test.${h.n?'<br><b>'+esc(h.n)+'</b>':''}</div></div>`+list(h.d)+`<div class="box b-green"><div class="lab">Tip</div><div class="c">${esc(q.tool)}</div></div>`;}
    if(!h.c.length)return b+`<div class="box b-yel"><div class="lab">No calculator math here</div><div class="c">${esc(q.tool)}</div></div>`;
    return b+(typeof tiPic==='function'?tiPic(h.c,h.c.length):'')+list(h.c);}
  if(k==='form'){const use=q.steps[0]||'';const c=qCards(q);
    return head('Formula','What this question uses, and what each letter means')+(typeof figFor==='function'?figFor(q):'')+(c||'<div class="box b-yel"><div class="c">No formula needed for this one. Use Show me how.</div></div>')+
     `<button class="btn o" data-pan="show" style="align-self:flex-start">Show me every step</button>`;}
  if(k==='learn'&&s.sec==='Math'&&QF[q.id]){const _S=seenIds(),_c=BANK.qs.filter(x=>x.id!==q.id&&QT[x.id]===QT[q.id]&&!(D&&D.qs.some(y=>y.id===x.id)));const sib=_c.find(x=>_S.has(x.id))||_c.find(x=>!_S.has(x.id));if(sib&&!_S.has(sib.id)){const sh=store.get('shown_ex',[]);sh.push(sib.id);store.set('shown_ex',sh)}const nm=(QF[q.id][0]||{}).n||s.name;
    let ex='';if(sib){const res=carried(sib,sib.steps),seen=new Set();ex=`<div class="box b-green"><div class="lab">Worked example · same type, different numbers</div><div class="c" style="font-family:'Source Serif 4',Georgia,serif;font-size:17px">${sib.q}</div></div>`+(typeof figFor==='function'?figFor(sib):'')+sib.steps.map((x,i)=>stepHTML(x,i,res,whereFrom(sib,x,i,seen))).join('')+(sib.trap?`<div class="box b-red"><div class="lab">Trap</div><div class="c">${esc(sib.trap)}</div></div>`:'');}
    return head('Learn it · '+esc(nm),'How to do this type of question')+`<button class="btn o" data-pan="video" style="align-self:flex-start">▶ Watch the video</button>`+qCards(q)+ex+`<div class="box b-yel"><div class="lab">Now you</div><div class="c">Do the same steps with the numbers in your question.</div></div><a class="btn o" style="align-self:flex-start;text-decoration:none" href="#/learn/${q.skill}">Open the full lesson</a>`;}
  if(k==='learn'){const ls=lessonData(q.skill);if(!ls)return head('Learn it',esc(s.name))+'<div class="box b-yel"><div class="c">Use Show me how for this one.</div></div>';const ex=ls.ex[0];
    return head('Learn it · '+esc(s.name),'How to do this type of question')+`<button class="btn o" data-pan="video" style="align-self:flex-start">▶ Watch the video</button>`+
     `<div class="box b-yel"><div class="lab">Big idea</div><div class="c">${ls.big}</div></div>`+
     (ls.defn?`<div class="box ${ls.math?'b-pur':'b-blue'}"><div class="lab">${ls.math?'Formulas and rules':'The rule'}</div><div class="c">${ls.defn}</div></div>`:'')+
     (ls.how.length?`<div class="box b-blue"><div class="lab">Do this every time</div><div class="c">${ls.how.map((h,i)=>(i+1)+'. '+h).join('<br>')}</div></div>`:'')+
     (ex?`<div class="box b-green"><div class="lab">Example</div><div class="c">${ex.s.replace(/\[\[(.+?)\]\]/g,'<b>$1</b>')}<br>${ex.parts.map(p=>p.replace(/\[\[(.+?)\]\]/g,'<b>$1</b>')).join(' → ')}</div></div>`:'')+
     (ls.rem?`<div class="box b-red"><div class="lab">Remember · traps</div><div class="c">${ls.rem}</div></div>`:'')+
     (ls.hook?`<div class="box b-green"><div class="lab">Memory hook</div><div class="c">${ls.hook}</div></div>`:'')+
     `<a class="btn o" style="align-self:flex-start;text-decoration:none" href="#/learn/${q.skill}">Open the full walk-through</a>`;}
  if(k==='video')return head('Video · '+esc(s.name),'Chalkboard lesson')+videoHTML(q.skill);
  if(k==='desmos')return head('Desmos','Same calculator as the test. Type, then click points on the graph.')+`<iframe class="desmos" src="https://www.desmos.com/calculator" title="Desmos graphing calculator"></iframe>`;
  if(k==='ref')return head('Reference sheet','The same formulas the SAT gives you')+`<div class="box b-pur"><div class="lab">Shapes</div><div class="c">Circle: <b>A = πr²</b>, <b>C = 2πr</b><br>Rectangle: <b>A = ℓw</b> · Triangle: <b>A = ½bh</b><br>Pythagorean: <b>c² = a² + b²</b><br>Special right triangles: 30-60-90 is <b>x, x√3, 2x</b> · 45-45-90 is <b>s, s, s√2</b></div></div>
   <div class="box b-pur"><div class="lab">Volume</div><div class="c">Box: <b>V = ℓwh</b> · Cylinder: <b>V = πr²h</b><br>Sphere: <b>V = ⁴⁄₃πr³</b> · Cone: <b>V = ⅓πr²h</b> · Pyramid: <b>V = ⅓ℓwh</b></div></div>
   <div class="box b-blue"><div class="lab">Facts</div><div class="c">A circle has 360° or 2π radians. A triangle's angles add to 180°.</div></div>`;
  return '';}

/* ---------- end of set ---------- */
function drawEnd(){if(D.date){const dt=D.date;dayStore(true);D=null;location.hash='#/report/'+dt;return}if(D.more){const t=D.st.filter(x=>x.tried.length);D.qs=D.qs.filter((q,k)=>D.st[k].tried.length);D.st=t}const n=D.qs.length,first=D.st.filter(t=>t.ok&&t.tried.length===1&&!t.coached).length,miss=D.qs.filter((q,k)=>!(D.st[k].ok&&D.st[k].tried.length===1));
  app().innerHTML=topbar('')+`<div class="end"><h1 class="hd" style="font-size:30px;margin:0">${esc(D.title)}: done</h1><div style="font-size:22px"><b>${first} of ${n}</b> right on the first try</div>
   ${D.skill?(n&&first/n>=.8?`<div class="keepon ok">Mastered for today: ${Math.round(100*first/n)}% right on the first try ✓</div>`:`<div class="keepon">Let's keep drilling until we master this.</div>`):''}
   <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${D.skill?`<button class="btn" data-go="#/drill/more:${D.skill}?${Date.now()}">Keep drilling ${esc(SK2[D.skill].name)}</button>`:''}${miss.length?`<button class="btn o" data-redo="1">Redo the ${miss.length} I missed</button>`:''}${D.skill?`<button class="btn g" data-go="#/learn/${D.skill}">Learn it</button>`:''}<button class="btn g" data-go="#/">Home</button></div></div>`;}

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-go]');if(!b)return;const d=b.dataset;if(d.pause){pauseOn();return}if(d.resume){pauseOff();return}
  if(d.go){const h=d.go.split('?')[0];if(location.hash===h)route();else location.hash=h;return}
  if(d.alldays){UI.allDays=!UI.allDays;return route()}
  if(d.lid){UI.lid=d.lid;return route()}
  if(d.vid){UI.vid=d.vid;if(D&&!D.done)return drawDrill();return route()}
  if(!D)return;
  const q=D.done?null:cur(),st=D.done?null:D.st[D.i];
  if(d.pick!==undefined){const j=+d.pick;if(st.tried.includes(j)||st.ok)return;st.tried.push(j);answer(j===q.ans,q.ch[j]);return}
  if(d.grid)return gridCheck();
  if(d.pan){UI.panel=UI.panel===d.pan?null:d.pan;if(UI.panel){const key=st.tried.length?'ha':'hb';st[key]=st[key]||[];if(!st[key].includes(UI.panel))st[key].push(UI.panel)}if(UI.panel==='show'){st.coached=st.coached||!st.ok;if(!st.shown)st.shown=1}return drawDrill()}
  if(d.dtab){UI.dtab=d.dtab;return drawDrill()}
  if(d.next){st.shown=(st.shown||1)+1;return drawDrill()}
  if(d.seek){UI.seek=+d.seek;const v=document.querySelector('video');if(v){v.currentTime=+d.seek;v.play().catch(()=>{})}return}
  if(d.mark){st.mark=!st.mark;return drawDrill()}
  if(d.navg){UI.nav=!UI.nav;return drawDrill()}
  if(d.jump!==undefined){if(+d.jump>D.i&&st&&st.tried.length&&!st.ok)return;D.i=+d.jump;UI.nav=false;UI.dtab=null;return showQ()}
  if(d.mv){if(+d.mv>0&&st&&st.tried.length&&!st.ok)return;const n=D.i+(+d.mv);if(n>=D.qs.length&&D.more){const nx=moreQs(D.more,D.qs);if(nx.length){D.qs=D.qs.concat(nx);D.st=D.st.concat(nx.map(()=>({tried:[],ok:false,shown:0,t0:0,coached:false})))}}
    if(n>=D.qs.length){D.done=true;return drawEnd()}if(n>=0){D.i=n;dayStore();UI.nav=false;if(UI.panel==='show')UI.panel=null;UI.dtab=null;showQ()}return}
  if(d.stopmore){D.done=true;return drawEnd()}
  if(d.redo){const miss=D.qs.filter((q,k)=>!(D.st[k].ok&&D.st[k].tried.length===1));D={...D,qs:miss,i:0,st:miss.map(()=>({tried:[],ok:false,shown:0,t0:0,coached:false})),t0:Date.now(),done:false,title:D.title+' · redo'};return showQ()}
});
HELM_AUTH.then(s=>{H.Authorization='Bearer '+s.access_token;return load()}).then(route);
setInterval(()=>{if(window.HELM_TOKEN)H.Authorization='Bearer '+window.HELM_TOKEN},60000);
</script>
