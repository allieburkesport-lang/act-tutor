body{margin:0}
.helm{--bg:#F6F7F9;--panel:#FFFFFF;--panel2:#F1F3F6;--line:#E3E6EB;--text:#0B1220;--muted:#566070;--accent:#0B2545;--onaccent:#FFFFFF;--gold:#C9A227;--gov:#3B6FB6;--ok:#15803D;--okbg:#E6F5EC;--warn:#B45309;--warnbg:#FDF0E1;--bad:#B91C1C;--badbg:#FCE8E8;--focus:#2563EB;--scrim:rgba(11,18,32,.42);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-ok{color:var(--ok);background:var(--okbg)}.pill-warn{color:var(--warn);background:var(--warnbg)}.pill-bad{color:var(--bad);background:var(--badbg)}.pill-neutral{color:var(--muted);background:var(--panel2)}.pill-today{color:var(--text);background:var(--panel2)}

.pl-legend .sw.st-gov{border-color:var(--b-gov)}.pl-legend .sw.st-law{border-color:var(--b-law)}.pl-legend .sw.st-stat{border-color:var(--b-stat)}.pl-legend .sw.st-sat{border-color:var(--b-sat)}.pl-legend .sw.st-usna{border-color:var(--b-usna)}.pl-legend .sw.st-extra{border-color:var(--b-extra)}.pl-legend .sw.st-pt{border-color:var(--b-pt)}.pl-legend .sw.st-cfa{border-color:var(--b-cfa)}.pl-legend .sw.st-pre{border-color:var(--b-pre)}.pl-legend .sw.st-act{border-color:var(--b-act)}.pl-legend .sw.st-test{border-color:var(--b-test)}

const MOD = {
  sat: { name: 'SAT', full: 'SAT Helm', link: 'Open SAT Helm', href: CONFIG.links.sat },
  gov: { name: 'AP Gov', full: 'AP Government', link: 'Open AP Gov', href: CONFIG.links.gov },
  pre: { name: 'Precalc', full: 'College Precalculus (ASU)', link: '', href: '' },
  usna: { name: 'USNA', full: 'USNA / BGO', link: '', href: '' },
  life: { name: 'Calendar', full: 'Calendar', link: '', href: '' }
};

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('helm.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('helm.' + k, JSON.stringify(v)); } catch (e) {} }
};
const parse = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const isoOf = (dt) => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const DAYMS = 86400000;
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / DAYMS);
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const LONGWD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const ICON = {
  arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>',
  sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
};

/* ---------- state ---------- */
const urlDate = new URLSearchParams(location.search).get('date');   // ?date=2026-11-22 to preview a day
const TODAY = urlDate && /^\d{4}-\d{2}-\d{2}$/.test(urlDate) ? urlDate : isoOf(new Date());
const state = {
  dark: store.get('theme', 'light') === 'dark',   // always opens in the white (light) design unless he picks dark
  collapsed: store.get('collapsed', false),
  done: store.get('done', {}),
  tab: 'all', drawer: null, searchOpen: false, query: '', notifOpen: false, loading: true
};

/* ---------- real progress from the other HELM pages (no manual checking) ----------
   AP Gov page -> "apgov_summary", SAT HELM -> "sat_summary", Blueprint -> ../drill-zone/blueprint.json */
const SUM = { apgov: (window.HELM_PROGRESS && HELM_PROGRESS.get('apgov_summary', null)) || null, sat: (window.HELM_PROGRESS && HELM_PROGRESS.get('sat_summary', null)) || null, bp: null };
const prevISO = (iso) => isoOf(new Date(parse(iso).getTime() - DAYMS));
function govItems() {
  if (!SUM.apgov || !SUM.apgov.days) return null;
  return SUM.apgov.days.flatMap((d) => d.steps.map((s) => ({ id: 'ag-' + d.date + '-' + s.id, row: 'gov', mod: 'gov', date: d.date, title: s.n, tracked: true, trackedDone: !!s.done,
    desc: 'Do this on the AP Gov page. It checks itself off when you finish it (watching the teacher pages, opening the notebook pages, finishing the quiz or uploading photos).' })));
}
function trackOf(it) {
  if (it.tracked) return { done: it.trackedDone, where: 'AP Gov' };
  if (it.row === 'sat' && /^SAT Helm/.test(it.title)) {
    const day = it.catchup ? prevISO(it.date) : it.date, s = SUM.sat && SUM.sat.days && SUM.sat.days.find((x) => x.date === day);
    return { done: !!(s && s.done), pct: s ? s.pct : 0, where: 'SAT Helm' };
  }
  if (it.row === 'sat' && it.title === 'SAT Blueprint') { const b = SUM.bp && SUM.bp.find((x) => x.day === it.date); return { done: !!(b && b.n > 0), where: 'Blueprint' }; }
  return null;
}
function items() { const g = govItems(); return g ? SCHEDULE.filter((t) => !(t.row === 'gov' && t.kind !== 'event' && t.kind !== 'note')).concat(g) : SCHEDULE; }
function deco(it) {
  const tr = trackOf(it);
  const done = tr ? !!tr.done : !!state.done[it.id];
  const m = MOD[it.mod];
  const dt = parse(it.date);
  const isEvent = it.kind === 'event' || it.kind === 'note';
  let st = 'Upcoming', sc = 'pill-neutral';
  const rel = diffDays(TODAY, it.date);
  if (isEvent) { st = it.test ? 'Quiz' : it.urgent ? 'Key event' : 'Scheduled'; sc = it.test ? 'pill-bad' : it.urgent ? 'pill-warn' : 'pill-neutral'; }
  else if (done) { st = 'Done'; sc = 'pill-ok'; }
  else if (rel < 0 || (it.catchup && rel === 0)) { st = 'Catch-up'; sc = 'pill-bad'; }
  else if (rel === 0) { st = 'Today'; sc = 'pill-today'; }
  return Object.assign({ time: '' }, it, { done, tracked: !!tr, trackWhere: tr ? tr.where : '', isEvent, isTask: !isEvent, m, rel, st, sc, dayShort: WD[dt.getDay()], dayDate: MON[dt.getMonth()] + ' ' + dt.getDate() });
}
const all = () => items().map(deco);
const tasks = () => all().filter((t) => t.isTask && !t.routine);
const cnt = (a) => a.filter((t) => t.done).length;
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const inDays = (n) => (n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : 'In ' + n + ' days');

function weekDates() {
  const t = parse(TODAY); const start = new Date(t.getTime() - t.getDay() * DAYMS);
  return Array.from({ length: 7 }, (_, i) => isoOf(new Date(start.getTime() + i * DAYMS)));
}

/* ---------- render pieces ---------- */
const checkBtn = (t) => t.tracked ? `<span class="check auto${t.done ? ' on' : ''}" role="img" aria-label="${esc((t.done ? 'Done: ' : 'Not done yet: ') + t.title)}" title="Checks itself off in ${esc(t.trackWhere)}"><span class="box">${ICON.check}</span></span>` : `<button class="check${t.done ? ' on' : ''}" type="button" data-action="toggle" data-id="${t.id}" aria-label="${esc((t.done ? 'Mark not done: ' : 'Mark done: ') + t.title)}"><span class="box">${ICON.check}</span></button>`;
const pill = (t, label) => `<span class="pill ${t.sc}">${esc(label || t.st)}</span>`;

function renderCanvas() {
  const T = tasks(), A = all();
  const today = T.filter((t) => t.rel === 0 || (t.rel < 0 && !t.done && t.rel >= -1)).sort((a, b) => (b.catchup || b.rel < 0 ? 1 : 0) - (a.catchup || a.rel < 0 ? 1 : 0) || (a.mod === 'sat' ? 0 : a.mod === 'gov' ? 1 : 2) - (b.mod === 'sat' ? 0 : b.mod === 'gov' ? 1 : 2));
  const week = weekDates();
  const weekT = T.filter((t) => week.includes(t.date));
  const satWeek = weekT.filter((t) => t.mod === 'sat');
  const next = today.find((t) => !t.done);
  const td = cnt(today), tt = today.length, tp = pct(td, tt);
  const ringC = 326.73;
  const daysToSat = Math.max(0, diffDays(TODAY, CONFIG.satDate));
  const quiz = A.filter((e) => e.test && e.rel >= 0).sort((a, b) => a.rel - b.rel)[0];
  const ptest = A.filter((e) => e.key && e.rel >= 0)[0];
  const t0 = parse(TODAY);

  // countdown ticks
  const ticks = []; for (let i = 0; i <= daysToSat && i <= 30; i++) {
    const iso = isoOf(new Date(t0.getTime() + i * DAYMS));
    ticks.push(`<span class="tick${i === 0 ? ' now' : ''}${ptest && ptest.date === iso ? ' ptest' : ''}${i === daysToSat ? ' test' : ''}"></span>`);
  }

  const modTile = (k, title, sub, href) => {
    const list = today.filter((t) => t.mod === k);
    const d = cnt(list);
    return `<section class="s6 card tile m2" aria-labelledby="${k}-h">
      <div class="tile-h"><div style="display:flex;flex-direction:column;gap:4px"><span class="mod mod-${k}">${esc(sub)}</span><h2 id="${k}-h" style="margin:0;font-size:22px">${esc(title)}</h2></div>
      <span class="tnum muted" style="font-weight:700">${d}/${list.length}</span></div>
      <div class="meter"><i style="width:${pct(d, list.length)}%"></i></div>
      <ul class="checklist">${list.length ? list.map((t) => `<li class="item${t.done ? ' is-done' : ''}">${checkBtn(t)}<button class="linkbtn ttl" type="button" data-action="open" data-id="${t.id}" style="flex:1">${esc(t.title)}</button>${pill(t)}</li>`).join('') : '<li class="muted" style="padding:8px 2px">Nothing assigned today.</li>'}</ul>
      <a class="btn btn-primary big" href="${esc(href)}" style="margin-top:auto">${esc(MOD[k].link)}${ICON.arrow}</a></section>`;
  };

  const head = week.map((iso) => { const dt = parse(iso); const isT = iso === TODAY;
    return `<div class="pl-head${isT ? ' today' : ''}" role="columnheader"><span>${WD[dt.getDay()]}</span><span class="tnum">${MON[dt.getMonth()]} ${dt.getDate()}</span>${isT ? '<em>Today</em>' : ''}</div>`; }).join('');
  const cellItem = (t) => {
    if (t.kind === 'note') return `<button class="pl-note" type="button" data-action="open" data-id="${t.id}">${esc(t.title)}</button>`;
    const sty = t.sty || t.row;
    if (t.isEvent) return `<button class="pl-tile st-${sty}" type="button" data-action="open" data-id="${t.id}"><span class="pl-txt">${t.time && !t.test ? esc(t.time) + ' ' : ''}${t.test ? 'AP GOV QUIZ: ' + esc(t.title.replace(/^AP Gov quiz — /, '')) : esc(t.title)}</span></button>`;
    if (sty === 'daily') return `<div class="pl-daily${t.done ? ' is-done' : ''}">${checkBtn(t)}<span class="ttl">${esc(t.title)}</span></div>`;
    return `<div class="pl-tile st-${sty}${t.done ? ' is-done' : ''}">${checkBtn(t)}<button class="linkbtn pl-txt ttl" type="button" data-action="open" data-id="${t.id}">${t.time && t.time !== 'AM' ? esc(t.time) + ' ' : ''}${esc(t.title)}</button></div>`;
  };
  const planner = ROWS.map((r) => {
    const cells = week.map((iso) => {
      const items = A.filter((t) => t.row === r.id && t.date === iso).sort((x, y) => (x.kind === 'note' ? -1 : 0) - (y.kind === 'note' ? -1 : 0) || (x.ord || (x.time === 'AM' || /^7/.test(x.time) ? 7 : 12)) - (y.ord || (y.time === 'AM' || /^7/.test(y.time) ? 7 : 12)));
      return `<div class="pl-cell${iso === TODAY ? ' today' : ''}" role="cell">${items.map(cellItem).join('')}</div>`;
    }).join('');
    return `<div class="pl-row" role="row"><div class="pl-label lab-${r.id}" role="rowheader">${esc(r.label)}</div>${cells}</div>`;
  }).join('');
  let hero;
  if (state.loading) hero = '<div class="skel" style="height:40px;width:80%"></div><div class="skel" style="height:18px;width:60%"></div><div class="skel" style="height:48px;width:220px"></div>';
  else if (next) hero = `<span class="mod mod-${next.mod}" style="font-size:13px">${esc(next.m.full)}</span>
      <h1 id="next-h" style="margin:0;font-size:34px;line-height:1.15;letter-spacing:-.02em">${esc(next.title)}</h1>
      <p class="muted" style="margin:0;font-size:16px;max-width:560px">${esc(next.desc)}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${next.m.link ? `<a class="btn btn-primary big" href="${esc(next.m.href)}">${esc(next.m.link)}${ICON.arrow}</a>` : ""}${next.tracked ? '' : `<button class="btn big" type="button" data-action="toggle" data-id="${next.id}">Mark done</button>`}</div>${next.tracked ? `<p class="muted" style="margin:0;font-size:13px">This checks itself off when you finish it in ${esc(next.trackWhere)}.</p>` : ''}`;
  else if (tt) hero = `<h1 id="next-h" style="margin:0;font-size:34px;letter-spacing:-.02em">Today’s list is done.</h1><p class="muted" style="margin:0;font-size:16px">Nice work. Check what’s coming up this week below.</p>`;
  else hero = `<h1 id="next-h" style="margin:0;font-size:34px;letter-spacing:-.02em">Nothing assigned today.</h1><p class="muted" style="margin:0;font-size:16px">Check what’s coming up this week below.</p>`;

  $('#canvas').innerHTML = `
  <section class="s8 card hero m1" aria-labelledby="next-h">
    <div style="display:flex;flex-direction:column;gap:18px;flex:1;min-width:0">
      <p class="eyebrow">${LONGWD[t0.getDay()]}, ${MON[t0.getMonth()]} ${t0.getDate()} · Do this next</p>${hero}
    </div>
    <div class="ringwrap" role="img" aria-label="${td} of ${tt} tasks done today">
      <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="52" fill="none" stroke="var(--panel2)" stroke-width="12"/><circle cx="66" cy="66" r="52" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(tp / 100) * ringC} ${ringC}" transform="rotate(-90 66 66)" style="transition:stroke-dasharray .4s"/></svg>
      <div class="ringlabel"><span class="tnum" style="font-size:30px;font-weight:700;line-height:1">${td}/${tt}</span><span class="muted" style="font-size:12px;font-weight:600">today</span></div>
    </div>
  </section>
  <section class="s4 card count m3" aria-label="SAT countdown">
    <p class="eyebrow" style="color:inherit;opacity:.8">SAT · ${WD[parse(CONFIG.satDate).getDay()]}, ${MON[parse(CONFIG.satDate).getMonth()]} ${parse(CONFIG.satDate).getDate()}</p>
    <div style="display:flex;align-items:baseline;gap:10px"><span class="tnum" style="font-size:64px;font-weight:800;line-height:1;letter-spacing:-.03em">${daysToSat}</span><span style="font-size:18px;font-weight:600">${daysToSat === 1 ? 'day' : 'days'} left</span></div>
    <div class="ticks light" role="img" aria-label="Countdown to the SAT">${ticks.join('')}</div>
    <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;opacity:.85"><span>Today</span>${ptest ? '<span>Practice test ' + ptest.dayShort + '</span>' : ''}<span>Test</span></div>
    <p style="margin:0;font-size:13px;font-weight:600">Goal ${CONFIG.satGoal} · Math first</p>
  </section>
  <section class="s12 kpis m3" aria-label="Progress" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <div class="card stat prog"><span class="label">Today</span><span class="metric tnum">${tp}<small>%</small></span><span class="delta">${td}/${tt} tasks</span><div class="pbar"><i style="width:${tp}%"></i></div></div>
    <div class="card stat prog"><span class="label">This week</span><span class="metric tnum">${pct(cnt(weekT), weekT.length)}<small>%</small></span><span class="delta">${cnt(weekT)}/${weekT.length} tasks</span><div class="pbar"><i style="width:${pct(cnt(weekT), weekT.length)}%"></i></div></div>
    <a class="card stat prog" href="${esc(MOD.gov.href)}"><span class="label">AP Gov · Ch. 4 part 2</span><span class="metric tnum">${SUM.apgov ? SUM.apgov.pct : 0}<small>%</small></span><span class="delta${quiz ? ' warn' : ''}">${quiz ? 'Quiz in ' + quiz.rel + (quiz.rel === 1 ? ' day' : ' days') : (SUM.apgov ? SUM.apgov.done + '/' + SUM.apgov.total + ' steps' : 'Open AP Gov')}</span><div class="pbar"><i style="width:${SUM.apgov ? SUM.apgov.pct : 0}%"></i></div></a>
    <a class="card stat prog" href="${esc(MOD.sat.href)}"><span class="label">SAT Helm plan</span><span class="metric tnum">${SUM.sat && SUM.sat.dueTotal ? pct(SUM.sat.dueDone, SUM.sat.dueTotal) : 0}<small>%</small></span><span class="delta">${SUM.sat ? SUM.sat.dueDone + '/' + SUM.sat.dueTotal + ' days so far' : 'Open SAT Helm'}</span><div class="pbar"><i style="width:${SUM.sat && SUM.sat.dueTotal ? pct(SUM.sat.dueDone, SUM.sat.dueTotal) : 0}%"></i></div></a>
  </section>
  ${modTile('sat', 'SAT Helm', 'SAT', MOD.sat.href)}
  ${modTile('gov', 'AP Government', 'AP Gov · Mr. Thomas', MOD.gov.href)}
  <section class="s12 card" aria-labelledby="wk-h">
    <div class="panel-h" style="padding-bottom:12px"><h2 id="wk-h">Week of ${MON[parse(week[0]).getMonth()]} ${parse(week[0]).getDate()} \u2013 ${MON[parse(week[6]).getMonth()]} ${parse(week[6]).getDate()}</h2><span class="muted" style="font-size:13px">Tap anything for details</span></div>
    <div class="pl-wrap"><div class="planner" role="table" aria-label="Weekly planner by class">
      <div class="pl-row pl-hrow" role="row"><div class="pl-label pl-corner" role="columnheader"><span style="position:absolute;left:-9999px">Class</span></div>${head}</div>
      ${planner}
    </div></div>
    <div class="pl-legend">${LEGEND.map(([k, l]) => `<span><i class="sw st-${k}"></i>${l}</span>`).join('')}</div>
  </section>`;
}

function renderOverlays() {
  let html = '';
  if (state.drawer) {
    const isMod = state.drawer.startsWith('m-');
    html += `<button class="scrim" type="button" aria-label="Close details" data-action="close"></button><aside class="drawer" role="dialog" aria-modal="true" aria-label="Details" id="drawer">`;
    if (isMod) {
      const k = state.drawer.slice(2), m = MOD[k], wk = weekDates();
      const mt = tasks().filter((t) => t.mod === k && wk.includes(t.date));
      const tl = mt.filter((t) => t.rel === 0), up = mt.filter((t) => t.rel > 0).slice(0, 4);
      html += `<header><span class="mod mod-${k}">${esc(m.name)}</span><button class="iconbtn" type="button" data-action="close" aria-label="Close details">${ICON.close}</button></header>
      <div class="body"><div><p class="eyebrow">Class</p><h3>${esc(m.full)}</h3></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="inner" style="padding:12px 14px"><p class="eyebrow">Today</p><p class="tnum" style="margin:4px 0 0;font-size:24px;font-weight:700">${cnt(tl)}/${tl.length}</p></div><div class="inner" style="padding:12px 14px"><p class="eyebrow">This week</p><p class="tnum" style="margin:4px 0 0;font-size:24px;font-weight:700">${cnt(mt)}/${mt.length}</p></div></div>
      <div style="display:flex;flex-direction:column;gap:8px"><p class="eyebrow">Today</p>${tl.map((t) => `<div class="inner mini">${checkBtn(t)}<span style="font-weight:600;flex:1">${esc(t.title)}</span></div>`).join('') || '<p class="muted" style="margin:0">Nothing today.</p>'}</div>
      <div style="display:flex;flex-direction:column;gap:8px"><p class="eyebrow">Coming up</p>${up.map((t) => `<div class="inner mini"><span class="muted tnum" style="width:64px;font-size:12px;font-weight:600">${t.dayShort} ${t.dayDate.split(' ')[1]}</span><span>${esc(t.title)}</span></div>`).join('')}</div></div>
      <footer><a class="btn btn-primary" href="${esc(m.href)}">${esc(m.link)}${ICON.arrow}</a><button class="btn" type="button" data-action="close">Back to Today</button></footer>`;
    } else {
      const t = all().find((x) => x.id === state.drawer);
      html += `<header><span class="mod mod-${t.mod}">${esc(t.m.name)}</span><button class="iconbtn" type="button" data-action="close" aria-label="Close details">${ICON.close}</button></header>
      <div class="body"><div style="display:flex;flex-direction:column;gap:10px">${pill(t)}<h3>${esc(t.title)}</h3><p class="muted" style="margin:0">${esc(t.desc)}</p></div>
      <dl class="kv" style="margin:0"><dt>When</dt><dd>${t.dayShort}, ${t.dayDate}</dd>${t.time ? `<dt>Time</dt><dd>${esc(t.time)}</dd>` : ''}<dt>Class</dt><dd>${esc(t.m.full)}</dd></dl>
      ${t.isTask && t.tracked ? `<div class="inner" style="display:flex;align-items:center;gap:14px;padding:14px 16px 14px 27px">${checkBtn(t)}<span style="font-weight:600">${t.done ? 'Done' : 'Checks itself off when you finish it in ' + esc(t.trackWhere)}</span></div>` : ''}
      ${t.isTask && !t.tracked ? `<div class="inner" style="display:flex;align-items:center;gap:14px;padding:14px 16px 14px 27px">${checkBtn(t)}<span style="font-weight:600">${t.done ? 'Done' : 'Mark as done'}</span></div>` : ''}</div>
      <footer>${t.m.link ? `<a class="btn btn-primary" href="${esc(t.m.href)}">${esc(t.m.link)}${ICON.arrow}</a>` : ''}<button class="btn" type="button" data-action="close">Back to Today</button></footer>`;
    }
    html += '</aside>';
  }
  if (state.searchOpen) {
    const q = state.query.toLowerCase().trim();
    const res = all().filter((t) => !q || (t.title + ' ' + t.m.name).toLowerCase().includes(q)).slice(0, 8);
    html += `<button class="scrim" type="button" aria-label="Close search" data-action="closeSearch"></button>
    <div class="palette card" role="dialog" aria-modal="true" aria-label="Search Helm"><div class="inp"><span class="muted">${ICON.search}</span><label for="helm-q" style="position:absolute;left:-9999px">Search tasks, classes and events</label><input id="helm-q" type="text" placeholder="Search tasks, classes, events…" value="${esc(state.query)}" autocomplete="off"><span class="muted" style="font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px">Esc</span></div>
    <div class="res" id="res">${res.map((t) => `<button class="res-item" type="button" data-action="open" data-id="${t.id}"><span class="mod mod-${t.mod}" style="width:72px">${esc(t.m.name)}</span><span style="font-weight:600;flex:1">${esc(t.title)}</span><span class="muted" style="font-size:12px">${t.dayShort}</span></button>`).join('') || '<p class="muted" style="padding:12px;margin:0">No matches.</p>'}</div></div>`;
  }
  $('#overlay').innerHTML = html;
  if (state.searchOpen) { const i = $('#helm-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

function renderNotif() {
  const items = all().filter((e) => (e.urgent && e.rel >= 0 && e.rel <= 7) || (e.isTask && !e.done && (e.rel < 0 || (e.catchup && e.rel === 0))));
  $('#notif-dot').style.display = items.length ? '' : 'none';
  $('#notif-pop').hidden = !state.notifOpen;
  $('#notif-pop').innerHTML = items.length ? items.map((e) => `<button class="res-item" type="button" data-action="open" data-id="${e.id}"><span class="pill ${e.sc}">${e.isEvent ? inDays(e.rel) : 'Catch-up'}</span><span style="font-weight:600">${esc(e.title)}</span></button>`).join('') : '<p class="muted" style="padding:12px;margin:0">You’re all caught up.</p>';
}

function render() {
  const app = $('#app');
  app.className = 'helm ' + (state.dark ? 'dark' : 'light') + (state.collapsed ? ' collapsed' : '');
  $('#theme-btn').innerHTML = state.dark ? ICON.sun : ICON.moon;
  $('#theme-btn').setAttribute('aria-label', state.dark ? 'Switch to light theme' : 'Switch to dark theme');
  $('#side-btn').setAttribute('aria-label', state.collapsed ? 'Expand sidebar' : 'Collapse sidebar');
  renderCanvas(); renderOverlays(); renderNotif();
}

/* ---------- events ---------- */
let lastFocus = null;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) { if (state.notifOpen && !e.target.closest('#notif-wrap')) { state.notifOpen = false; renderNotif(); } return; }
  const a = el.dataset.action, id = el.dataset.id;
  if (a === 'toggle') { state.done[id] = !state.done[id]; store.set('done', state.done); render(); return; }
  if (a === 'open') { lastFocus = lastFocus || document.activeElement; state.drawer = id; state.searchOpen = false; state.notifOpen = false; render(); const c = document.querySelector('#drawer .iconbtn'); if (c) c.focus(); return; }
  if (a === 'close') { state.drawer = null; render(); if (lastFocus && lastFocus.isConnected) lastFocus.focus(); lastFocus = null; return; }
  if (a === 'tab') { state.tab = id; renderCanvas(); return; }
  if (a === 'theme') { state.dark = !state.dark; store.set('theme', state.dark ? 'dark' : 'light'); render(); return; }
  if (a === 'side') { state.collapsed = !state.collapsed; store.set('collapsed', state.collapsed); render(); return; }
  if (a === 'search') { lastFocus = document.activeElement; state.searchOpen = true; state.query = ''; renderOverlays(); return; }
  if (a === 'closeSearch') { state.searchOpen = false; renderOverlays(); return; }
  if (a === 'notif') { state.notifOpen = !state.notifOpen; renderNotif(); return; }
});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'helm-q') return;
  state.query = e.target.value;
  const q = state.query.toLowerCase().trim();
  const res = all().filter((t) => !q || (t.title + ' ' + t.m.name).toLowerCase().includes(q)).slice(0, 8);
  $('#res').innerHTML = res.map((t) => `<button class="res-item" type="button" data-action="open" data-id="${t.id}"><span class="mod mod-${t.mod}" style="width:72px">${esc(t.m.name)}</span><span style="font-weight:600;flex:1">${esc(t.title)}</span><span class="muted" style="font-size:12px">${t.dayShort}</span></button>`).join('') || '<p class="muted" style="padding:12px;margin:0">No matches.</p>';
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); state.searchOpen = !state.searchOpen; state.query = ''; renderOverlays(); return; }
  if (e.key === 'Escape') {
    if (state.searchOpen) { state.searchOpen = false; renderOverlays(); }
    else if (state.drawer) { state.drawer = null; render(); if (lastFocus && lastFocus.isConnected) lastFocus.focus(); lastFocus = null; }
    else if (state.notifOpen) { state.notifOpen = false; renderNotif(); }
  }
  if (e.key === 'Enter' && state.searchOpen && e.target.id === 'helm-q') { const f = document.querySelector('#res [data-action="open"]'); if (f) f.click(); }
});

render();
setTimeout(() => { state.loading = false; renderCanvas(); }, 600);
fetch('../drill-zone/blueprint.json?' + Date.now()).then((r) => r.json()).then((b) => { SUM.bp = b.daily || []; render(); }).catch(() => {});
(window.HELM_AUTH || Promise.reject()).then(async () => {
  const [a, s] = await Promise.all([HELM_PROGRESS.pull('apgov_summary'), HELM_PROGRESS.pull('sat_summary')]);
  if (a) SUM.apgov = a; if (s) SUM.sat = s; render();
}).catch(() => {});
addEventListener('pageshow', () => { SUM.apgov = HELM_PROGRESS.get('apgov_summary', SUM.apgov); SUM.sat = HELM_PROGRESS.get('sat_summary', SUM.sat); render(); });

</script>
</body>
</html>
