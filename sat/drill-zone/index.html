    question_no:+row.id.split('-').pop(),question:(row.id+' '+plain(q.q)).slice(0,600),picked:String(row.picked).slice(0,300),
    correct:row.ok,first_try:row.first,attempt:row.attempt,seconds:row.sec})}).catch(()=>{});

async function pullOnline(){ // merge answers made on other devices
  try{const r=await fetch(SB+'?select=concept_id,question,correct,first_try,attempt,seconds,created_at&kind=eq.bank&student=eq.'+WHO+'&order=created_at.asc&limit=10000',{headers:H});
    const rows=await r.json(); if(!Array.isArray(rows))return;

    const near=(id,t)=>LOG.some(x=>x.id===id&&Math.abs(x.ts-t)<120000);
    rows.forEach(w=>{const id=(w.question||'').split(' ')[0];if(!QBY[id])return;const t=Date.parse(w.created_at);
      if(near(id,t))return; LOG.push({id,ts:t,day:new Date(t).toLocaleDateString('en-CA'),ok:w.correct,first:w.first_try,attempt:w.attempt,sec:w.seconds,picked:''});});

}

// ---------- stats ----------
function firstTries(){const seen={},out=[];LOG.forEach(r=>{if(r.attempt===1&&!seen[r.id+'|'+r.ts]){seen[r.id+'|'+r.ts]=1;out.push(r)}});return out}
function statsBySkill(){
  const st={};BANK.skills.forEach(s=>st[s.id]={n:0,ok:0,seen:new Set(),last:null});
  firstTries().forEach(r=>{const q=QBY[r.id];if(!q)return;const x=st[q.skill];x.n++;x.ok+=r.ok?1:0;x.seen.add(r.id);x.last=r.day});
  return st;
}
function level(s,st){
  const bp=BP.skills[s.id]||{n:0,ok:0}, dz=st[s.id];
  // recent Drill Zone work counts double, Blueprint history counts once
  const n=bp.n+2*dz.n, ok=bp.ok+2*dz.ok, p=pct(ok,n);
  return {p, n:bp.n+dz.n, label:(bp.n+dz.n)<3?'Not started':p>=80&&dz.n>=8?'Strong':p>=50?'Getting there':'Needs work',
    cls:(bp.n+dz.n)<3?'none':p>=80&&dz.n>=8?'ok':p>=50?'mid':'bad'};
}
const pill=(p,cls,txt)=>`<span class="pill ${cls}">${txt??(p===null?'—':p+'%')}</span>`;
const cl=p=>p===null?'none':p>=80?'ok':p>=50?'mid':'bad';

function misses(){const m=store.get('satbank_miss',{});return Object.keys(m).filter(id=>m[id]>0&&QBY[id])}
function streak(){const days=new Set(firstTries().map(r=>r.day));let n=0,d=new Date();
  if(!days.has(today()))d.setDate(d.getDate()-1);
  while(days.has(d.toLocaleDateString('en-CA'))){n++;d.setDate(d.getDate()-1)}return n}

function planBtns(row,st){
  const weak=sec=>BANK.skills.filter(s=>s.sec===sec).map(s=>[s,level(s,st).p??-1]).sort((a,b)=>a[1]-b[1]).map(x=>x[0].id);
  const wm=weak('Math'),we=weak('English');
  return row[2].concat(row[3]).map(id=>{
    if(id==='MIXM')return '<button class="sm pri" data-start="mixed:Math">Mixed math</button>';
    if(id==='MIXE')return '<button class="sm" data-start="mixed:English">Mixed English</button>';
    const sid=id==='WEAK'?wm[0]:id==='WEAK2'?wm[1]:id==='WEAKE'?we[0]:id;
    return `<button class="sm ${SKILL[sid].sec==='Math'?'pri':''}" data-start="skill:${sid}">${esc(SKILL[sid].name)}</button>`}).join(' ');
}
// ---------- dashboard ----------

  document.getElementById('main').innerHTML=h;window.scrollTo({top:0});

// ---------- drill ----------
function pickQueue(mode,arg){
  const st=statsBySkill(), seen=new Set(firstTries().map(r=>r.id)), miss=store.get('satbank_miss',{});
  const order=q=>({E:0,M:1,H:2}[q.diff]);
  const fresh=list=>{const a=list.filter(q=>!seen.has(q.id)),b=list.filter(q=>seen.has(q.id));return a.concat(b)};
  if(mode==='skill'){const l=BANK.qs.filter(q=>q.skill===arg).sort((a,b)=>order(a)-order(b));
    return fresh(l).sort((a,b)=>(seen.has(a.id)-seen.has(b.id))||order(a)-order(b)).slice(0,10)}
  if(mode==='miss')return misses().map(id=>QBY[id]).slice(0,15);
  // mixed: weakest skills get more questions
  const sk=BANK.skills.filter(s=>s.sec===arg).map(s=>[s,level(s,st).p??0]).sort((a,b)=>a[1]-b[1]);
  const want=arg==='Math'?20:10, out=[];let k=0;
  while(out.length<want&&k<200){const s=sk[Math.min(sk.length-1,Math.floor(Math.pow(Math.random(),1.8)*sk.length))][0];
    const c=fresh(BANK.qs.filter(q=>q.skill===s.id&&!out.includes(q)&&q.diff!=='H'||q.skill===s.id&&!out.includes(q)&&out.length>want/2));
    if(c.length)out.push(c[0]);k++}
  return out;
}
function start(mode,arg){
  const qs=pickQueue(mode,arg); if(!qs.length){alert('No questions found.');return}
  drill={mode,arg,qs,i:0,right:0,title:mode==='skill'?SKILL[arg].name:mode==='miss'?'Redo my misses':'Mixed '+arg};
  location.hash='drill';newQ();
}
function newQ(){const q=drill.qs[drill.i];drill.cur={q,t0:Date.now(),tried:[],findOk:q.find?null:true,coach:null,coached:false,done:false};render();window.scrollTo({top:0})}
function stepParts(s,prev){ // split a step into [what to do, hidden result]
  const i=s.indexOf(': ');if(i>0)return [s.slice(0,i),s.slice(i+2)];
  const j=Math.max(s.lastIndexOf(' = '),s.lastIndexOf(' → '));
  if(j>=0){const left=s.slice(0,j).trim(),res=s.slice(j+3).trim();
    if(!left){const p=prev?stepParts(prev)[1]:null;return [p?`Finish it: ${p} = ?`:'Finish the math. What does it equal?',res]}
    return [left+' = ?',res]}
  if(s.startsWith('= ')){const p=prev?stepParts(prev)[1]:null;return [p?`Finish it: ${p} = ?`:'Finish the math. What does it equal?',s.slice(2)]}
  return [s,null]}
function numOf(s){if(s==null)return null;const m=String(s).replace(/−/g,'-').replace(/,/g,'').match(/(-?\d+(\.\d+)?)(\/(\d+))?(?!.*\d)/);if(!m)return null;return m[4]?parseFloat(m[1])/parseFloat(m[4]):parseFloat(m[1])}
function gridOk(q,v){const s=String(v).replace(/−/g,'-').replace(/[\s,$%°]/g,'');if(!s)return false;
  let x=s.includes('/')?s.split('/').reduce((a,b)=>parseFloat(a)/parseFloat(b)):parseFloat(s);
  return q.grid.some(g=>{const t=g.replace(/−/g,'-');const y=t.includes('/')?t.split('/').reduce((a,b)=>parseFloat(a)/parseFloat(b)):parseFloat(t);return s===t||(isFinite(x)&&Math.abs(x-y)<=Math.max(1e-3,Math.abs(y)*1e-3))})}
let tick=null;
function render(){
  clearInterval(tick);
  const c=drill.cur,q=c.q,s=SKILL[q.skill],n=drill.qs.length;
  let h=`<div class="meta"><b>${esc(drill.title)}</b> · Question ${drill.i+1} of ${n} · <span class="pill none">${esc(s.name)}</span> <span class="pill ${q.diff==='E'?'ok':q.diff==='M'?'mid':'bad'}">${DIFF[q.diff]}</span>
   · <span class="timer" id="tm">0:00</span> <span class="sub">(SAT pace ≈ ${PACE[s.sec]} s)</span> <span style="flex:1"></span><button class="sm" id="quit">✕ Back to dashboard</button></div>
   <div class="prog"><i style="width:${100*drill.i/n}%"></i></div><div class="card"><div class="q">${q.q}</div>`;
  if(q.find&&c.findOk!==true){
    h+=`<div class="box b-blue find"><b class="t">STEP 1 · FIND: WHAT IS THIS QUESTION ASKING FOR?</b><div class="opts">${q.find.opts.map((o,j)=>`<button class="opt" data-find="${j}"><span class="L">${j+1}</span><span>${esc(o)}</span></button>`).join('')}</div>
    ${c.findOk===false?'<p class="wrong-t">Not quite. Read the LAST line of the question again, then pick.</p>':''}</div>`;
  } else {
    if(q.find)h+=`<p class="sub">✓ FIND: ${esc(q.find.opts[q.find.ok])}</p>`;
    if(s.sec==='Math'&&TOOLS&&TOOLS.S[q.skill]){const x=TOOLS.S[q.skill];h+=toolHTML({m:x[0],alt:x[1],why:x[2]+' For this question: '+q.tool},q.id+'|'+drill.i,false)}
    const solved=c.done;
    if(q.ch){h+=`<div class="opts">${q.ch.map((o,j)=>{const t=c.tried.includes(j);const cls=t?(j===q.ans?'right':'wrong'):(solved&&j===q.ans?'right':'');
      return `<button class="opt ${cls}" data-a="${j}" ${t||solved?'disabled':''}><span class="L">${L[j]}</span><span>${o}</span></button>`}).join('')}</div>`}
    else{h+=`<p><b>Type your answer</b> (fractions like 7/2 are fine):</p><input type="text" id="gin" inputmode="decimal" ${solved?'disabled':''} value="${esc(c.lastGrid||'')}"> <button id="gsub" ${solved?'disabled':''}>Check</button>
      ${c.tried.length&&!solved?`<p class="wrong-t">${esc(c.lastGrid)} is not right.</p>`:''}${solved?`<p class="right-t">✓ ${esc(q.show)}</p>`:''}`}
    if(c.tried.length&&!solved&&!c.coach)h+=`<div class="box b-red"><b class="t">NOT YET</b>Try again, or let's work it out together.<div class="go" style="margin-top:8px"><button class="big pri" id="coach">🧑‍🏫 Coach me up</button></div></div>`;
    if(c.coach)h+=`<div class="box b-purple"><b class="t">🧑‍🏫 COACH IS OPEN ON THE RIGHT →</b>Do each step in the panel, then answer here. <button class="sm" id="coachshow">Show the coach</button></div>`;
    if(solved){
      h+=`<div class="box b-green"><b class="t">${c.tried.length===1&&!c.coached?'RIGHT ON THE FIRST TRY ✓':'GOT IT ✓'}</b>${esc(q.tool)}</div>`;
      if(!c.coach)h+=`<details><summary><b>See the steps</b></summary>${q.steps.map((x,k)=>`<div class="step"><h4>Step ${k+1}</h4>${esc(x)}</div>`).join('')}</details>`;
      h+=`<div class="box b-red"><b class="t">TRAP TO WATCH</b>${esc(q.trap)}</div><div class="go">${c.coached||c.tried.length>1?'<button class="big grn" id="similar">Try one like it</button>':''}<button class="big pri" id="next">${drill.i+1<n?'Next question →':'Finish'}</button></div>`;
    }
  }
  h+='</div>';
  document.getElementById('main').innerHTML=h;
  if(c.coach&&(FLY.key===null||FLY.key==='__html')&&!FLY.dismissed)flyHTML(coachHTML());else if(!c.coach&&FLY.key==='__html')flyClose();
  const tm=document.getElementById('tm');
  if(!c.done)tick=setInterval(()=>{const sec=Math.round((Date.now()-c.t0)/1000);tm.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');tm.className='timer'+(sec>PACE[s.sec]*1.5?' slow':'')},1000);
}
function coachHTML(){
  const c=drill.cur,q=c.q,K=c.coach;let h=`<div class="box b-purple"><b class="t">COACH ME UP · ONE STEP AT A TIME</b>Do each step yourself first. Then open the next one.`;
  q.steps.forEach((s,k)=>{if(k>K.open)return;const [doIt,res]=stepParts(s,q.steps[k-1]);const st=K.state[k]||{};
    h+=`<div class="step ${st.shown?'done':''}"><h4>Step ${k+1} of ${q.steps.length}</h4><div>${esc(doIt)}</div>`;
    if(res&&!st.shown){h+=`<p style="margin:8px 0 4px"><b>Your turn:</b> do this step. What do you get?</p><input type="text" id="cs${k}" placeholder="your answer for this step"> <button data-cs="${k}">Check my step</button> <button class="sm" data-cshow="${k}">Show me</button>`}
    else if(res){h+=`<p>${st.verdict?`<span class="${st.verdict==='ok'?'right-t':'wrong-t'}">${st.verdict==='ok'?'✓ You got it.':'Not quite. Here it is:'}</span> `:''}<b>${esc(res)}</b></p>`}
    else if(!st.shown){h+=`<button data-cshow="${k}">I did this step ✓</button>`}
    h+='</div>';
  });
  const allDone=q.steps.every((s,k)=>(K.state[k]||{}).shown);
  if(!allDone&&K.state[K.open]?.shown)h+=`<button class="pri" id="cnext">Open step ${K.open+2} ▾</button>`;
  if(allDone)h+=`<div class="box b-yellow"><b class="t">NOW YOU ANSWER</b>Use your steps to answer the question above. ${esc(q.trap)}</div>`;
  return h+'</div>';
}
function answer(ok,picked){
  const c=drill.cur,q=c.q,s=SKILL[q.skill];
  const row={id:q.id,ts:Date.now(),day:today(),ok,first:ok&&c.tried.length===1&&!c.coached,attempt:c.tried.length,sec:Math.round((Date.now()-c.t0)/1000),picked,find:c.findMiss?false:undefined,coached:c.coached};
  save(row);
  const miss=store.get('satbank_miss',{});
  if(!ok&&c.tried.length===1){miss[q.id]=2;store.set('satbank_miss',miss);  // must get it right twice later
    if(!drill.qs.slice(drill.i+1).includes(q))drill.qs.splice(Math.min(drill.qs.length,drill.i+4),0,q)} // comes back in 3 questions
  if(ok&&c.tried.length===1&&miss[q.id]){miss[q.id]--;if(miss[q.id]<=0)delete miss[q.id];store.set('satbank_miss',miss)}
  if(ok){c.done=true;if(c.tried.length===1)drill.right++}
  render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-start]');if(!b||b.disabled)return;
  if(b.dataset.start){const [m,a]=b.dataset.start.split(':');start(m,a);return}
  if(!drill)return;const c=drill.cur,q=c.q;
  if(b.id==='quit'){location.hash='';return}
  if(b.dataset.find!==undefined){const j=+b.dataset.find;if(j===q.find.ok){c.findOk=true}else{c.findOk=false;c.findMiss=true}render();return}
  if(b.dataset.a!==undefined){const j=+b.dataset.a;c.tried.push(j);answer(j===q.ans,plain(q.ch[j]));return}
  if(b.id==='gsub'){const v=document.getElementById('gin').value.trim();if(!v)return;c.tried.push(v);c.lastGrid=v;answer(gridOk(q,v),v);return}
  if(b.id==='coach'){c.coach={open:0,state:{}};c.coached=true;FLY.dismissed=false;if(FLY.key&&FLY.key!=='__html')flyClose();render();return}
  if(b.id==='coachshow'){FLY.dismissed=false;if(FLY.key&&FLY.key!=='__html')flyClose();render();return}
  if(b.dataset.cs!==undefined){const k=+b.dataset.cs,v=document.getElementById('cs'+k).value.trim();if(!v)return;
    const res=stepParts(q.steps[k],q.steps[k-1])[1],a=numOf(res),u=numOf(v);
    const ok=(a!==null&&u!==null&&Math.abs(a-u)<1e-6)||res.toLowerCase().replace(/[^a-z0-9]/g,'').includes(v.toLowerCase().replace(/[^a-z0-9]/g,''))&&v.length>2;
    c.coach.state[k]={shown:true,verdict:ok?'ok':'no'};render();return}
  if(b.dataset.cshow!==undefined){c.coach.state[+b.dataset.cshow]={shown:true};render();return}
  if(b.id==='cnext'){c.coach.open++;render();return}
  if(b.id==='similar'){const seen=new Set(drill.qs.map(x=>x.id));const sim=BANK.qs.filter(x=>x.skill===q.skill&&!seen.has(x.id)).sort((a,b)=>(a.diff===q.diff?0:1)-(b.diff===q.diff?0:1))[0];
    if(sim){drill.qs.splice(drill.i+1,0,sim)}drill.i++;newQ();return}
  if(b.id==='next'){drill.i++;if(drill.i>=drill.qs.length){finish();return}newQ();return}
});
document.addEventListener('keydown',e=>{if(!drill||e.target.tagName==='INPUT'){if(e.key==='Enter'&&e.target.id==='gin')document.getElementById('gsub').click();if(e.key==='Enter'&&/^cs\d+$/.test(e.target.id))document.querySelector(`[data-cs="${e.target.id.slice(2)}"]`).click();return}
  const k=e.key.toUpperCase(),j='ABCD'.indexOf(k)>=0?'ABCD'.indexOf(k):'1234'.indexOf(k);if(j<0)return;
  const bs=[...document.querySelectorAll('#main [data-a]:not([disabled]),#main [data-find]')];const t=bs.find(x=>(x.dataset.a??x.dataset.find)==j);if(t)t.click()});
function finish(){
  const n=drill.qs.length;document.getElementById('main').innerHTML=`<div class="card"><h2>Done: ${esc(drill.title)}</h2>
   <p style="font-size:20px">Right on the first try: <b>${drill.right} of ${n}</b></p>
   <div class="box b-yellow"><b class="t">SAY IT OUT LOUD</b>Name the one rule or trick that helped most today, and the one trap that got you.</div>
   <div class="go"><button class="big pri" id="again">Another set</button><button class="big" id="home">Dashboard</button></div></div>`;
  const m=drill.mode,a=drill.arg;document.getElementById('again').onclick=()=>start(m,a);document.getElementById('home').onclick=()=>{location.hash=''};drill=null;
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(/^[srmtgade]\d$/.test(h)){location.replace('learn.html#'+h);return}if(h!=='drill')dash()});
document.getElementById('n-dash').onclick=e=>{e.preventDefault();location.hash='';dash()};
(async()=>{
  try{[BANK,BP]=await Promise.all([fetch('bank.json').then(r=>r.json()),fetch('blueprint.json').then(r=>r.json())])}
  catch(e){document.getElementById('main').innerHTML='<p>Could not load the questions. Check the internet connection and refresh.</p>';return}
  BANK.skills.forEach(s=>SKILL[s.id]=s);BANK.qs.forEach(q=>QBY[q.id]=q);
  LOG=store.get('satbank_log',[]);try{localStorage.setItem('satname',WHO)}catch(e){}
  if(location.hash==='#drill')location.hash='';
  dash();await pullOnline();if(!drill)dash();
})();
</script></body></html>
